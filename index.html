<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klint</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{
  --bg:#131313; --panel:#181818; --card:#1e1e1e; --card2:#242424; --line:#2a2a2a; --line2:#353535;
  --text:#ececec; --muted:#8e8e8e; --dim:#6a6a6a; --accent:#4d8dff; --accent2:#7aa9ff; --ok:#46c28a;
  --r:16px; --sbw:240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0e0e0e;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;height:100vh;gap:0}
/* sidebar */
.sb{width:var(--sbw);padding:14px 10px;display:flex;flex-direction:column;gap:4px;transition:margin .25s,opacity .2s;flex:none}
.sb.hide{margin-left:calc(var(--sbw) * -1);opacity:0;pointer-events:none}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 12px}
.logo{width:30px;height:30px;border-radius:9px;background:#f2f2f2;color:#111;display:grid;place-items:center}
.logo svg{width:19px;height:19px;stroke:#111;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--card2);color:var(--text)}
.newchat{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line2);background:#1a1a1a;border-radius:11px;font-weight:500;margin-bottom:8px;transition:.15s}
.newchat:hover{background:var(--card2)}
.newchat kbd{margin-left:auto;display:flex;gap:4px}
kbd span{font:11px ui-monospace,monospace;background:#2a2a2a;color:var(--muted);padding:1px 6px;border-radius:5px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:#cfcfcf;text-align:left;transition:.15s;width:100%}
.nav:hover{background:var(--card)}
.sec{font-size:12.5px;color:var(--dim);padding:16px 12px 6px}
.hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.hi{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;color:#bdbdbd;cursor:pointer;font-size:13.5px}
.hi span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi:hover{background:var(--card)}
.hi.on{background:var(--card2);color:#fff}
.hi .del{opacity:0;color:var(--muted);width:22px;height:22px;display:grid;place-items:center;border-radius:6px}
.hi:hover .del{opacity:1}.hi .del:hover{background:#333;color:#fff}
.sb-foot{border-top:1px solid var(--line);padding:12px 8px 4px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.sb-foot .av{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:#aaa}
/* main */
.main{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;margin:6px 6px 6px 0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{display:flex;align-items:center;padding:12px 14px;gap:10px;min-height:56px}
.top .grow{flex:1}
.pill{padding:7px 14px;border-radius:10px;background:#242424;font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:8px;transition:.15s}
.pill:hover{background:#2e2e2e}
.pill.light{background:#ececec;color:#111}.pill.light:hover{background:#fff}
#openSb{display:none}
.sb.hide ~ .main #openSb{display:grid}
.stage{flex:1;overflow:auto;scroll-behavior:smooth}
/* home */
.home{height:100%;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 80px}
.big-logo{width:76px;height:76px;border-radius:22px;background:#f2f2f2;display:grid;place-items:center;margin-bottom:18px;box-shadow:0 0 80px rgba(120,160,255,.15)}
.big-logo svg{width:64px;height:64px;stroke:#111;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.home h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-bottom:26px;text-align:center}
.home h1 em{font-style:normal;background:linear-gradient(90deg,#8ab4ff,#c3a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px;max-width:760px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 15px;border:1px solid var(--line2);border-radius:999px;color:#c7c7c7;font-size:13.5px;transition:.18s;background:transparent}
.chip:hover{background:var(--card2);color:#fff;transform:translateY(-1px)}
/* composer */
.composer-wrap{width:100%;max-width:768px;position:relative}
.composer{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:14px 14px 10px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#4a4a4a;box-shadow:0 0 0 4px rgba(255,255,255,.03)}
.composer textarea{width:100%;background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:15px;max-height:220px;min-height:28px;padding:2px 4px;display:block}
.composer textarea::placeholder{color:#777}
.c-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.c-row .grow{flex:1}
.model{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:9px;transition:.15s}
.model:hover{background:var(--card2)}
.model b{color:#ddd;font-weight:600}
.mwrap{position:relative}
.menu{display:none;position:absolute;right:0;bottom:calc(100% + 8px);width:272px;background:#1c1c1c;border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.55);z-index:20}
.menu.open{display:block;animation:rise .18s ease both}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;color:#cfcfcf}
.mi:hover,.mi.on{background:var(--card2)}
.mi div{flex:1}.mi b{display:block;color:#f0f0f0;font-weight:600;font-size:13.5px}.mi small{color:var(--muted);font-size:12px}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.files:empty{display:none}
.fchip{display:flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:4px 6px 4px 10px;font-size:12.5px;color:#ccc;max-width:220px}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.fchip button:hover{background:#3a3a3a;color:#fff}
.fchip svg.i{width:14px;height:14px}
.nav.on{background:var(--card2);color:#fff}
.backdrop{display:none}
.logo,.big-logo,.bot-av{background:transparent!important;border:0!important;box-shadow:none!important}
.send{width:34px;height:34px;border-radius:50%;background:#3a3a3a;color:#888;display:grid;place-items:center;transition:.2s}
.send.ready{background:#f2f2f2;color:#111}.send.ready:hover{transform:scale(1.07)}
.send.stop{background:#f2f2f2;color:#111}
.dock{padding:0 20px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.foot{font-size:11.5px;color:var(--dim);text-align:center}
/* chat */
.chat{max-width:768px;margin:0 auto;padding:10px 20px 30px;display:flex;flex-direction:column;gap:26px}
.msg{display:flex;gap:14px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.bubble{background:var(--card2);padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:82%;white-space:pre-wrap;word-break:break-word}
.bot-av{width:30px;height:30px;border-radius:9px;background:#f2f2f2;display:grid;place-items:center;flex:none;margin-top:2px}
.bot-av svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bot-av.busy{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.bot{flex:1;min-width:0}
.md>*:first-child{margin-top:0}
.md p{margin:10px 0}
.md h1,.md h2,.md h3,.md h4{margin:20px 0 8px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.md h1{font-size:21px}.md h2{font-size:18px}.md h3{font-size:16px}
.md ul,.md ol{margin:8px 0 8px 22px}.md li{margin:3px 0}
.md a{color:var(--accent2);text-decoration:none}.md a:hover{text-decoration:underline}
.md blockquote{border-left:3px solid var(--line2);padding-left:14px;color:#b5b5b5;margin:10px 0}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.md code.in{background:#262626;border:1px solid #303030;padding:1px 6px;border-radius:6px;font:12.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:#e6c07b}
.md table{border-collapse:collapse;margin:12px 0;font-size:13.5px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line2);padding:6px 12px}.md th{background:var(--card)}
.code{margin:12px 0;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:#161616}
.code-h{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 14px;background:#1d1d1d;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.code-h .lang{flex:1;text-transform:lowercase}
.cbtn{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;font-size:12.5px;color:#bbb;transition:.15s}
.cbtn:hover{background:#2c2c2c;color:#fff}
.cbtn.on{background:#e9e9e9;color:#111}
.code pre{padding:14px 16px;overflow:auto;max-height:460px;font:12.5px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d6d6d6;tab-size:2}
.pv{border-top:1px solid var(--line);background:#0b0b0b;padding:12px;display:flex;justify-content:center}
.pv iframe{border:0;background:#fff;border-radius:10px;width:100%;height:480px;transition:width .3s}
.pv.phone iframe{width:375px;max-width:100%;height:640px;border:6px solid #2a2a2a;border-radius:26px}
.msg-tools{display:flex;gap:2px;margin-top:6px;opacity:0;transition:.2s}
.msg:hover .msg-tools{opacity:1}
/* thinking */
.think{display:flex;align-items:center;gap:12px;padding:6px 0}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:#bbb;animation:bounce 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}
.status{font-weight:500;background:linear-gradient(90deg,#666 0%,#fff 45%,#666 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.8s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.progress{height:2px;border-radius:2px;background:#262626;overflow:hidden;margin:10px 0 2px;max-width:220px}
.progress i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--accent2),transparent);animation:slide 1.3s infinite ease-in-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(280%)}}
.live{display:flex;align-items:center;gap:10px;margin-top:8px}
.err{color:#ff8b8b;background:#2a1a1a;border:1px solid #4a2a2a;padding:10px 14px;border-radius:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#ececec;color:#111;padding:8px 16px;border-radius:999px;font-weight:500;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
@media(max-width:760px){
  .sb{position:fixed;z-index:30;inset:0 auto 0 0;background:#0e0e0e;width:260px;margin-left:0}
  .sb.hide{margin-left:-270px}
  .sb:not(.hide)~.backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
  .main{margin:0;border-radius:0;border:0}
  .home h1{font-size:24px}
  .bubble{max-width:92%}
}
</style>
</head>
<body>
<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="mark" viewBox="0 0 24 24"><g fill="#fff" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"><path d="M2.3 1H9.9V11.6L3 22.7H2.3Z"/><path d="M11.9 11L19.3 1.4H21.2V10.4H11.9Z"/><path d="M11.9 13L21.2 19.6V23H11.9Z"/></g></symbol>
    <symbol id="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="bubble" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></symbol>
    <symbol id="panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="code" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
    <symbol id="down" viewBox="0 0 24 24"><path d="M12 4v12M6 11l6 6 6-6M5 21h14"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="square" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></symbol>
    <symbol id="phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
    <symbol id="monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="layout" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 9v12"/></symbol>
    <symbol id="spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
    <symbol id="game" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4M16 11.5h.01M18 13.5h.01"/></symbol>
    <symbol id="chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16v-5M13 16V8M18 16v-8"/></symbol>
    <symbol id="research" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
    <symbol id="brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V4a3 3 0 0 0-3 0zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="sb" id="sb">
    <div class="sb-top">
      <div class="logo"><svg><use href="#mark"/></svg></div>
      <button class="icon-btn" id="closeSb" title="Hide sidebar"><svg class="i"><use href="#panel"/></svg></button>
    </div>
    <button class="newchat" id="newChat"><svg class="i"><use href="#bubble"/></svg>New chat<kbd><span>Ctrl</span><span>K</span></kbd></button>
    <button class="nav on" data-mode="chat"><svg class="i"><use href="#bubble"/></svg>Chat</button>
    <button class="nav" data-mode="web"><svg class="i"><use href="#layout"/></svg>Websites</button>
    <button class="nav" data-mode="game"><svg class="i"><use href="#game"/></svg>Games</button>
    <button class="nav" data-mode="dash"><svg class="i"><use href="#chart"/></svg>Dashboards</button>
    <button class="nav" data-mode="research"><svg class="i"><use href="#research"/></svg>Research</button>
    <div class="sec">Chats</div>
    <div class="hist" id="hist"></div>
    <div class="sb-foot"><div class="av"><svg class="i"><use href="#user"/></svg></div><div>Klint 8 &middot; by Taskbound</div></div>
  </aside>
  <div class="backdrop" id="bd"></div>

  <main class="main">
    <div class="top">
      <button class="icon-btn" id="openSb" title="Show sidebar"><svg class="i"><use href="#panel"/></svg></button>
      <div class="grow"></div>
      <button class="pill" id="clearAll"><svg class="i"><use href="#trash"/></svg>Clear all</button>
      <button class="pill light" id="dl" style="display:none"><svg class="i"><use href="#down"/></svg>Export chat</button>
    </div>
    <div class="stage" id="stage">
      <div class="home" id="home">
        <div class="big-logo"><svg><use href="#mark"/></svg></div>
        <h1 id="homeTitle">What are we <em>building</em> today?</h1>
        <div class="composer-wrap" id="homeComposer"></div>
        <div class="chips" id="chips">
          <button class="chip" data-p="Design a stunning modern landing page for a SaaS startup with hero, features, pricing and footer"><svg class="i"><use href="#layout"/></svg>Landing page</button>
          <button class="chip" data-p="Build a polished analytics dashboard with charts, KPI cards and a sidebar"><svg class="i"><use href="#chart"/></svg>Dashboard</button>
          <button class="chip" data-p="Build a fun, smooth, fully playable snake game with score and difficulty levels"><svg class="i"><use href="#game"/></svg>Game</button>
          <button class="chip" data-p="Create a mobile app UI mockup for a fitness tracker with three screens"><svg class="i"><use href="#phone"/></svg>Mobile app UI</button>
          <button class="chip" data-p="Explain how neural networks learn, with a clear structure and examples"><svg class="i"><use href="#brain"/></svg>Explain</button>
          <button class="chip" data-p="Write clean, well-structured code for a todo app with local storage"><svg class="i"><use href="#code"/></svg>Code</button>
        </div>
      </div>
      <div class="chat" id="chat" style="display:none"></div>
    </div>
    <div class="dock" id="dock" style="display:none"></div>
    <div class="foot" style="display:none"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<template id="composerT">
  <div class="composer">
    <textarea rows="1" placeholder="Ask anything, or describe what to build..."></textarea>
    <div class="files"></div>
    <div class="c-row">
      <button class="icon-btn attach" type="button" title="Attach text or code files"><svg class="i"><use href="#plus"/></svg></button>
      <input type="file" class="fileIn" multiple hidden accept=".txt,.md,.json,.csv,.js,.ts,.jsx,.tsx,.html,.css,.py,.java,.c,.cpp,.cs,.go,.rs,.php,.sql,.xml,.yaml,.yml,.log,.sh">
      <div class="grow"></div>
      <div class="mwrap"><button class="model" type="button"><svg class="i" style="width:15px;height:15px"><use href="#spark"/></svg><b>Klint 8</b><span class="tier">Pro</span><svg class="i" style="width:14px;height:14px"><use href="#chev"/></svg></button><div class="menu"></div></div>
      <button class="send" title="Send"><svg class="i"><use href="#up"/></svg></button>
    </div>
  </div>
</template>

<script>
/* ============ CONFIG ============ */
const BRAND = { name: "Klint", model: "Klint 8", maker: "Taskbound" };
/* Base model served through Puter.js. Change this one line if your Puter model id differs. */
const BASE_MODEL = "gpt-luna-6";
const FALLBACK_MODEL = null; // null = Puter default model if the base id is rejected

# Core behavior
- Understand the real intent behind the request before answering. Infer reasonable defaults rather than asking questions when the request is workable; ask one short question only if truly blocked.
- Deliver complete, working, polished output on the first try. Never leave TODOs, placeholders, "rest of code here", or lorem-ipsum when real copy can be written.

# Building web pages, apps, games, UI
When asked to build, design, make or replicate any page, app, component, tool, game or interface:
1. Output ONE complete, self-contained, runnable HTML file in a single \`\`\`html fenced block (inline CSS and JS, no build step). Only use CDNs when truly valuable (e.g. Chart.js, Three.js) and prefer vanilla.
2. Briefly (1-3 lines) state the design direction before the code, and 2-4 bullet highlights after. No long essays.
3. Design quality is non-negotiable:

4. Functionality must truly work: wire up all buttons, forms, tabs, modals, state, validation, persistence (localStorage where sensible), keyboard shortcuts for apps/games. Handle errors and empty data gracefully. Use clean, modular, commented-where-needed JavaScript with no globals leaking carelessly.

# Explanations, research, writing, analysis

- Use concrete examples and analogies. Show reasoning for non-obvious conclusions. State assumptions.

function makeComposer(host){
  host.innerHTML = "";
  const n = $("#composerT").content.cloneNode(true);
  host.appendChild(n);
  const ta = host.querySelector("textarea"), send = host.querySelector(".send");
  const fit = () => { ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,220)+"px"; send.classList.toggle("ready", !!ta.value.trim() || busy || !!(host._files && host._files.length)); };
  ta.addEventListener("input", fit);
  ta.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); go(); } });
  const go = () => {
    if(busy){ abortFlag = true; return; }
    const v = ta.value.trim(); if(!v && !host._files.length) return;
    const files = host._files; host._files = []; renderFiles();
    ta.value=""; fit();
    let full = v, shown = v;
    if(files.length){
      full += files.map(f=>"\n\n[Attached file: "+f.name+"]\n```\n"+f.text+"\n```").join("");
      shown += (v?"\n":"") + "Attached: " + files.map(f=>f.name).join(", ");
    }
    submit(full, shown);
  };
  send.addEventListener("click", go);
  host._ta = ta; host._send = send; host._fit = fit;

  host._files = [];
  const fileIn = host.querySelector(".fileIn"), filesEl = host.querySelector(".files");

/* ============ MARKDOWN ============ */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(t){
  t = esc(t);
  t = t.replace(/`([^`]+)`/g,'<code class="in">$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}
function md(src, streaming){
  const codes = [];
  // extract fenced code (handles unclosed fence while streaming)
  src = src.replace(/```([\w+-]*)\n([\s\S]*?)(```|$)/g,(m,lang,code,end)=>{
    codes.push({lang:lang||"text", code:code.replace(/\n$/,""), done:end==="```"});
    return `\n@@CODE${codes.length-1}@@\n`;
  });
  const lines = src.split("\n"); let out="", list=null, para=[];
  const flushP=()=>{ if(para.length){ out+="<p>"+inline(para.join(" "))+"</p>"; para=[]; } };
  const flushL=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  for(let i=0;i<lines.length;i++){
    const l = lines[i];
    let m;
    if((m=l.match(/^@@CODE(\d+)@@$/))){ flushP();flushL(); out+=`@@CODE${m[1]}@@`; continue; }
    if(!l.trim()){ flushP();flushL(); continue; }
    if((m=l.match(/^(#{1,4})\s+(.*)/))){ flushP();flushL(); out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ flushP();flushL(); out+="<hr>"; continue; }
    if((m=l.match(/^>\s?(.*)/))){ flushP();flushL(); out+=`<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if(l.includes("|") && lines[i+1] && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
      flushP();flushL();
      const row = r=>r.replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>c.trim());
      const head=row(l); i+=2; let body="";
      while(i<lines.length && lines[i].includes("|") && lines[i].trim()){ body+="<tr>"+row(lines[i]).map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>"; i++; }
      i--; out+=`<table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`; continue;
    }
    if((m=l.match(/^\s*[-*+]\s+(.*)/))){ flushP(); if(list!=="ul"){flushL(); out+="<ul>"; list="ul";} out+=`<li>${inline(m[1])}</li>`; continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ flushP(); if(list!=="ol"){flushL(); out+="<ol>"; list="ol";} out+=`<li>${inline(m[1])}</li>`; continue; }
    flushL(); para.push(l.trim());
  }
  flushP(); flushL();
  return out.replace(/@@CODE(\d+)@@/g,(m,i)=>codeBlock(codes[i], streaming));
}
let codeStore = {};
function codeBlock(c, streaming){
  const id = uid(); codeStore[id]=c.code;
  const html = /^(html|svg)$/i.test(c.lang);
  const ready = c.done && !streaming;
  return `<div class="code" data-id="${id}">
    <div class="code-h"><span class="lang">${esc(c.lang)}</span>
      ${html && ready ? `<button class="cbtn" data-act="preview">${SVG("eye")}Preview</button>` : ""}
      ${html && ready ? `<button class="cbtn" data-act="openTab">${SVG("external")}Open</button>` : ""}
      ${html && ready ? `<button class="cbtn" data-act="dlfile">${SVG("down")}Save</button>` : ""}
      <button class="cbtn" data-act="copy">${SVG("copy")}Copy</button></div>
    <pre><code>${esc(c.code)}</code></pre></div>`;
}

/* ============ AI ============ */
async function streamAI(history, onToken){
  const msgs = [{role:"system", content:buildSystem()}, ...history.map(m=>({role:m.role, content:m.content}))];
  const run = async model => {
    const opts = { stream:true }; if(model) opts.model = model;
    const res = await puter.ai.chat(msgs, opts);
    if(res && res[Symbol.asyncIterator]){
      for await (const part of res){ if(abortFlag) break; const t = part?.text ?? ""; if(t) onToken(t); }
    } else {
      const t = res?.message?.content ?? res?.toString?.() ?? "";
      onToken(typeof t==="string"?t:JSON.stringify(t));
    }
  };
  let got = false;
  const emit = onToken;
  onToken = t => { got = true; emit(t); };
  try { await run(BASE_MODEL); }
  catch(e){
    if(got) throw e;
    await run(FALLBACK_MODEL);
  }
}

async function submit(text, shown){
  if(busy) return;
  let c = chats.find(x=>x.id===cur);
  if(!c){ c = {id:uid(), title:(shown||text).replace(/\s+/g," ").slice(0,42), messages:[]}; chats.push(c); cur=c.id; }
  c.messages.push({role:"user", content:text, shown:shown||text});
  store.set(chats);
  renderChat();
  await respond(c);
}

async function respond(c){
  busy = true; abortFlag = false; setSendState();
  const el = document.createElement("div");
  el.className = "msg assistant";
  el.innerHTML = `<div class="bot-av busy"><svg><use href="#mark"/></svg></div><div class="bot"><div class="md"></div><div class="live"><div class="dots"><i></i><i></i><i></i></div><span class="status">Thinking...</span></div><div class="progress"><i></i></div><div class="msg-tools"></div></div>`;
  $("#chat").appendChild(el);
  const mdEl = el.querySelector(".md"), status = el.querySelector(".status");
  const stage = $("#stage");
  let si = 0, full = "", raf = 0, tokens = 0;
  const cycle = setInterval(()=>{ si = Math.min(si+1, STATUS.length-1); status.textContent = (full ? (STATUS[Math.max(2,si)]) : STATUS[si]) + "..."; }, 2600);
  stage.scrollTop = 1e9;
  const paint = () => { raf=0; mdEl.innerHTML = md(full, true); const near = stage.scrollHeight - stage.scrollTop - stage.clientHeight < 160; if(near) stage.scrollTop = stage.scrollHeight; };
  try{
    await streamAI(c.messages, t=>{
      full += t; tokens++;
      if(tokens===1) { si = 2; status.textContent = "Building..."; }
      if(!raf) raf = requestAnimationFrame(paint);
    });
    if(!full.trim()) throw new Error("No response received. Make sure Puter is reachable and sign in if prompted.");
  }catch(e){
    const msg = (e && (e.message || e.error?.message || (typeof e==="string"?e:""))) || "Something went wrong.";
    if(!full) { mdEl.innerHTML = `<div class="err">${esc(msg)}</div>`; }
    else full += "\n\n_Generation interrupted._";
  }
  clearInterval(cycle); cancelAnimationFrame(raf);
  el.querySelector(".live")?.remove(); el.querySelector(".progress")?.remove();
  el.querySelector(".bot-av").classList.remove("busy");
  if(full){
    mdEl.innerHTML = md(full);
    c.messages.push({role:"assistant", content:full}); store.set(chats);
    tools(el, {});
  } else { tools(el, {}); }
  busy = false; setSendState();
  stage.scrollTop = stage.scrollHeight;
}

        if(!h.querySelector('[data-act="device"]')){
          const d = document.createElement("button"); d.className="cbtn"; d.dataset.act="device"; d.innerHTML = SVG("phone")+"Mobile";
          h.insertBefore(d, h.querySelector('[data-act="preview"]'));
        }
      }
      return;
    }
    if(act==="device"){
      const pv = b.closest(".code").querySelector(".pv"); if(!pv) return;
      const ph = pv.classList.toggle("phone");
      b.innerHTML = ph ? SVG("monitor")+"Desktop" : SVG("phone")+"Mobile";
      return;
    }
    if(act==="copymsg"){ const c=chats.find(x=>x.id===cur); const idx=[...$("#chat").children].indexOf(b.closest(".msg")); const m=c.messages[idx]; navigator.clipboard.writeText(m?m.content:b.closest(".bot").innerText); toast("Copied"); return; }
    if(act==="regen"){ if(busy) return; const c=chats.find(x=>x.id===cur); if(!c) return; while(c.messages.length && c.messages[c.messages.length-1].role==="assistant") c.messages.pop(); store.set(chats); renderChat(); respond(c); return; }
  }
  const mo = e.target.closest("[data-mode]");
  if(mo){ setMode(mo.dataset.mode); return; }
  const p = e.target.closest("[data-p]");
  if(p && !busy){ submit(p.dataset.p); if(innerWidth<760) $("#sb").classList.add("hide"); }
});
function newChat(){ if(busy) return; cur=null; renderChat(); setTimeout(()=>$("#homeComposer")._ta?.focus(),50); }
$("#newChat").onclick = newChat;
$("#closeSb").onclick = ()=>$("#sb").classList.add("hide");
$("#openSb").onclick = ()=>$("#sb").classList.remove("hide");
$("#clearAll").onclick = ()=>{ if(busy) return; if(!chats.length || confirm("Delete all chats?")){ chats=[]; store.set(chats); cur=null; renderChat(); } };
$("#dl").onclick = ()=>{
  const c = chats.find(x=>x.id===cur); if(!c) return;
  const txt = c.messages.map(m=>(m.role==="user"?"You":BRAND.model)+":\n"+m.content).join("\n\n---\n\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/markdown"})); a.download="klint-chat.md"; a.click();
};
document.addEventListener("keydown", e=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); newChat(); } });

/* ============ INIT ============ */
makeComposer($("#homeComposer"));
const dockC = document.createElement("div"); dockC.className="composer-wrap"; $("#dock").appendChild(dockC); makeComposer(dockC);
const note = document.createElement("div"); note.className="foot"; note.textContent = BRAND.model+" can make mistakes. Built by "+BRAND.maker+"."; $("#dock").appendChild(note);
if(innerWidth<760) $("#sb").classList.add("hide");
$("#bd").onclick = ()=>$("#sb").classList.add("hide");
document.addEventListener("click", e=>{ if(!e.target.closest(".mwrap")) closeMenus(); });
renderHome();
renderChat();
</script>
