<!DOCTYPE html>
<html lang="en">
<head>
<script>try{var _t=localStorage.getItem("klint_theme")||"dark";if(_t==="system")_t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=_t;document.documentElement.dataset.fs=localStorage.getItem("klint_fs")||"m"}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klint</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{
  --bg:#131313; --panel:#181818; --card:#1e1e1e; --card2:#242424; --line:#2a2a2a; --line2:#353535;
  --text:#ececec; --muted:#8e8e8e; --dim:#6a6a6a; --accent:#4d8dff; --accent2:#7aa9ff; --ok:#46c28a;
  --r:16px; --sbw:240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0e0e0e;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;height:100vh;gap:0}

.sb{width:var(--sbw);padding:14px 10px;display:flex;flex-direction:column;gap:4px;transition:margin .25s,opacity .2s;flex:none}
.sb.hide{margin-left:calc(var(--sbw) * -1);opacity:0;pointer-events:none}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 12px}
.logo{width:30px;height:30px;border-radius:9px;background:#f2f2f2;color:#111;display:grid;place-items:center}
.logo svg{width:19px;height:19px;stroke:#111;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--card2);color:var(--text)}
.newchat{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line2);background:#1a1a1a;border-radius:11px;font-weight:500;margin-bottom:8px;transition:.15s}
.newchat:hover{background:var(--card2)}
.newchat kbd{margin-left:auto;display:flex;gap:4px}
kbd span{font:11px ui-monospace,monospace;background:#2a2a2a;color:var(--muted);padding:1px 6px;border-radius:5px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:#cfcfcf;text-align:left;transition:.15s;width:100%}
.nav:hover{background:var(--card)}
.sec{font-size:12.5px;color:var(--dim);padding:16px 12px 6px}
.hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.hi{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;color:#bdbdbd;cursor:pointer;font-size:13.5px}
.hi span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi:hover{background:var(--card)}
.hi.on{background:var(--card2);color:#fff}
.hi .del{opacity:0;color:var(--muted);width:22px;height:22px;display:grid;place-items:center;border-radius:6px}
.hi:hover .del{opacity:1}.hi .del:hover{background:#333;color:#fff}
.sb-foot{border-top:1px solid var(--line);padding:12px 8px 4px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.acct{display:flex;flex-direction:column;line-height:1.25}.acct b{color:#e6e6e6;font-weight:600;font-size:13px}.acct small{color:var(--dim);font-size:11.5px}
.sb-foot .av{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:#aaa}

.main{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;margin:6px 6px 6px 0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{display:flex;align-items:center;padding:12px 14px;gap:10px;min-height:56px}
.top .grow{flex:1}
.pill{padding:7px 14px;border-radius:10px;background:#242424;font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:8px;transition:.15s}
.pill:hover{background:#2e2e2e}
.pill.light{background:#ececec;color:#111}.pill.light:hover{background:#fff}
#openSb{display:none}
.sb.hide ~ .main #openSb{display:grid}
.stage{flex:1;overflow:auto;scroll-behavior:smooth}

.home{height:100%;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 80px}
.big-logo{width:76px;height:76px;border-radius:22px;background:#f2f2f2;display:grid;place-items:center;margin-bottom:18px;box-shadow:0 0 80px rgba(120,160,255,.15)}
.big-logo svg{width:64px;height:64px;stroke:#111;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.home h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-bottom:26px;text-align:center}
.home h1 em{font-style:normal;background:linear-gradient(90deg,#8ab4ff,#c3a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px;max-width:760px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 15px;border:1px solid var(--line2);border-radius:999px;color:#c7c7c7;font-size:13.5px;transition:.18s;background:transparent}
.chip:hover{background:var(--card2);color:#fff;transform:translateY(-1px)}

.composer-wrap{width:100%;max-width:768px;position:relative}
.composer{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:14px 14px 10px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#4a4a4a;box-shadow:0 0 0 4px rgba(255,255,255,.03)}
.composer textarea{width:100%;background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:15px;max-height:220px;min-height:28px;padding:2px 4px;display:block}
.composer textarea::placeholder{color:#777}
.c-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.c-row .grow{flex:1}
.model{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:9px;transition:.15s}
.model:hover{background:var(--card2)}
.model b{color:#ddd;font-weight:600}
.tier{font-size:11px;font-weight:600;letter-spacing:.03em;padding:1px 8px;border-radius:999px;line-height:1.5}
.tier.pro,.badge.pro{color:#ffb454;background:rgba(255,180,84,.14);border:1px solid rgba(255,180,84,.35)}
.tier.lite,.badge.lite{color:#6fd3a0;background:rgba(111,211,160,.12);border:1px solid rgba(111,211,160,.32)}
.badge{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:0 7px;border-radius:999px;vertical-align:1px}
.mwrap{position:relative}
.menu{display:none;position:absolute;right:0;bottom:calc(100% + 8px);width:272px;background:#1c1c1c;border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.55);z-index:20}
.menu.open{display:block;animation:rise .18s ease both}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;color:#cfcfcf}
.mi:hover,.mi.on{background:var(--card2)}
.mi div{flex:1}.mi b{display:block;color:#f0f0f0;font-weight:600;font-size:13.5px}.mi small{color:var(--muted);font-size:12px}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.files:empty{display:none}
.fchip{display:flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:4px 6px 4px 10px;font-size:12.5px;color:#ccc;max-width:220px}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.fchip button:hover{background:#3a3a3a;color:#fff}
.fchip svg.i{width:14px;height:14px}
.nav.on{background:var(--card2);color:#fff}
.backdrop{display:none}
.logo,.big-logo,.bot-av{background:transparent!important;border:0!important;box-shadow:none!important}
.send{width:34px;height:34px;border-radius:50%;background:#3a3a3a;color:#888;display:grid;place-items:center;transition:.2s}
.send.ready{background:#f2f2f2;color:#111}.send.ready:hover{transform:scale(1.07)}
.send.stop{background:#f2f2f2;color:#111}
.dock{padding:0 20px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.foot{font-size:11.5px;color:var(--dim);text-align:center}

.chat{max-width:768px;margin:0 auto;padding:10px 20px 30px;display:flex;flex-direction:column;gap:26px}
.msg{display:flex;gap:14px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.bubble{background:var(--card2);padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:82%;white-space:pre-wrap;word-break:break-word}
.bot-av{width:30px;height:30px;border-radius:9px;background:#f2f2f2;display:grid;place-items:center;flex:none;margin-top:2px}
.bot-av svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bot-av.busy{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.bot{flex:1;min-width:0}
.md>*:first-child{margin-top:0}
.md p{margin:10px 0}
.md h1,.md h2,.md h3,.md h4{margin:20px 0 8px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.md h1{font-size:21px}.md h2{font-size:18px}.md h3{font-size:16px}
.md ul,.md ol{margin:8px 0 8px 22px}.md li{margin:3px 0}
.md a{color:var(--accent2);text-decoration:none}.md a:hover{text-decoration:underline}
.md blockquote{border-left:3px solid var(--line2);padding-left:14px;color:#b5b5b5;margin:10px 0}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.md code.in{background:#262626;border:1px solid #303030;padding:1px 6px;border-radius:6px;font:12.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:#e6c07b}
.md table{border-collapse:collapse;margin:12px 0;font-size:13.5px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line2);padding:6px 12px}.md th{background:var(--card)}
.code{margin:12px 0;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:#161616}
.code-h{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 14px;background:#1d1d1d;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.code-h .lang{flex:1;text-transform:lowercase}
.cbtn{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;font-size:12.5px;color:#bbb;transition:.15s}
.cbtn:hover{background:#2c2c2c;color:#fff}
.cbtn.on{background:#e9e9e9;color:#111}
.code pre{padding:14px 16px;overflow:auto;max-height:460px;font:12.5px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d6d6d6;tab-size:2}
.pv{border-top:1px solid var(--line);background:#0b0b0b;padding:12px;display:flex;justify-content:center}
.pv iframe{border:0;background:#fff;border-radius:10px;width:100%;height:480px;transition:width .3s}
.pv.phone iframe{width:375px;max-width:100%;height:640px;border:6px solid #2a2a2a;border-radius:26px}
.msg-tools{display:flex;gap:2px;margin-top:6px;opacity:0;transition:.2s}
.msg:hover .msg-tools{opacity:1}

.think{display:flex;align-items:center;gap:12px;padding:6px 0}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:#bbb;animation:bounce 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-6px);opacity:1}}
.status{font-weight:500;background:linear-gradient(90deg,#666 0%,#fff 45%,#666 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.8s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.progress{height:2px;border-radius:2px;background:#262626;overflow:hidden;margin:10px 0 2px;max-width:220px}
.progress i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--accent2),transparent);animation:slide 1.3s infinite ease-in-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(280%)}}
.live{display:flex;align-items:center;gap:10px;margin-top:8px}
.err{color:#ff8b8b;background:#2a1a1a;border:1px solid #4a2a2a;padding:10px 14px;border-radius:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#ececec;color:#111;padding:8px 16px;border-radius:999px;font-weight:500;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
@media(max-width:760px){
  .sb{position:fixed;z-index:30;inset:0 auto 0 0;background:#0e0e0e;width:260px;margin-left:0}
  .sb.hide{margin-left:-270px}
  .sb:not(.hide)~.backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
  .main{margin:0;border-radius:0;border:0}
  .home h1{font-size:24px}
  .bubble{max-width:92%}
}

/* ===== live view window (macOS style) ===== */
.toast{z-index:200}
.cbtn.view{background:#e9e9e9;color:#111;font-weight:600}
.cbtn.view:hover{background:#fff;color:#111}
.lv{position:fixed;z-index:80;display:flex;flex-direction:column;background:#161616;border:1px solid #3a3a3a;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.45);overflow:hidden;opacity:0;visibility:hidden;transform:scale(.96) translateY(10px);transition:opacity .2s,transform .26s cubic-bezier(.2,.8,.2,1),left .22s,top .22s,width .22s,height .22s,border-radius .22s,visibility 0s .26s}
.lv.show{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .26s cubic-bezier(.2,.8,.2,1),left .22s,top .22s,width .22s,height .22s,border-radius .22s,visibility 0s}
.lv.min,.lv.show.min{opacity:0;visibility:hidden;transform:scale(.1);pointer-events:none;transition:opacity .22s,transform .3s cubic-bezier(.4,0,.2,1),visibility 0s .3s}
.lv.full{left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;border-radius:0;border:0}
.lv.drag{transition:none!important}
.lv-bar{display:flex;align-items:center;gap:12px;height:42px;padding:0 10px 0 14px;background:linear-gradient(#2c2c2c,#242424);border-bottom:1px solid #101010;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;flex:none}
.lv.full .lv-bar{cursor:default}
.lv.drag .lv-bar{cursor:grabbing}
.lv-tl{display:flex;gap:8px;flex:none}
.tl{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(0,0,0,.28);padding:0}
.tl.r{background:#ff5f57}.tl.y{background:#febc2e}.tl.g{background:#28c840}
.tl svg{width:9px;height:9px;stroke:rgba(0,0,0,.7);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s}
.lv-tl:hover .tl svg{opacity:1}
.lv-title{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:#bdbdbd;white-space:nowrap;overflow:hidden}
.lv-title b{font-weight:600;color:#e6e6e6}
.lv-title small{color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.lv-dot{width:7px;height:7px;border-radius:50%;background:#46c28a;flex:none;display:inline-block}
.lv-dot.building{background:#ffb454;animation:pulse 1.1s ease-in-out infinite}
.lv-acts{display:flex;align-items:center;gap:2px;flex:none}
.lv-acts .icon-btn{width:30px;height:30px}
.lv-exit{display:none;align-items:center;gap:7px;margin-left:6px;padding:5px 12px;border-radius:9px;background:#ececec;color:#111;font-weight:600;font-size:12.5px}
.lv-exit:hover{background:#fff}
.lv.full .lv-exit{display:flex}
.lv-stage{position:relative;flex:1;min-height:0;background:#0b0b0b;display:flex;justify-content:center;overflow:hidden}
.lv-frames{position:relative;width:100%;height:100%;transition:width .3s}
.lv-frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;pointer-events:none}
.lv-frames iframe.on{opacity:1;pointer-events:auto}
.lv-stage.phone{align-items:center;padding:14px 0}
.lv-stage.phone .lv-frames{width:375px;max-width:calc(100% - 20px);height:min(100%,760px);border:6px solid #2a2a2a;border-radius:26px;overflow:hidden}
.lv-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px;pointer-events:none}
.lv-shield{position:absolute;inset:0;display:none}
.lv.drag .lv-shield{display:block}
.lv-rs{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;display:grid;place-items:center;z-index:2}
.lv-rs svg{width:13px;height:13px;stroke:#777;stroke-width:1.6;fill:none;stroke-linecap:round}
.lv.full .lv-rs{display:none}
.lv-dock{position:fixed;right:18px;bottom:18px;z-index:81;display:none;align-items:center;gap:10px;padding:9px 14px;background:#222;border:1px solid var(--line2);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);color:#e6e6e6;font-weight:500;font-size:13px}
.lv-dock.show{display:flex;animation:rise .25s ease both}
.lv-dock:hover{background:#2b2b2b}
@media(max-width:760px){.lv-title small{display:none}.lv-acts .icon-btn{width:28px}}
@media(prefers-reduced-motion:reduce){.lv,.lv *{transition:none!important;animation:none!important}}

/* ===== themes, settings ===== */
:root{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light;--bg:#ffffff;--panel:#f7f7f8;--card:#f4f4f5;--card2:#ebebed;--line:#e6e6e9;--line2:#d9d9de;--text:#18181b;--muted:#63636b;--dim:#8a8a93;--accent:#2563eb;--accent2:#2f6bdc}
:root[data-fs="s"] body{font-size:13.5px}
:root[data-fs="l"] body{font-size:16px}
.logo,.big-logo,.bot-av{color:var(--text)}
.acctbtn{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:10px;text-align:left;color:inherit;transition:.15s}
.acctbtn:hover{background:var(--card)}
.acctbtn .gear{margin-left:auto;color:var(--dim);width:16px;height:16px}
.acctbtn{gap:8px;padding:6px}
.acctbtn .acct{min-width:0;flex:1}
.acctbtn .acct small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.acctbtn:hover .gear{color:var(--text)}
.sb-foot{padding:8px 0 2px}
.modal{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal.open{display:flex;animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{width:100%;max-width:540px;max-height:min(88vh,740px);display:flex;flex-direction:column;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.5);overflow:hidden;animation:rise .25s ease both}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 12px 20px;border-bottom:1px solid var(--line);font-size:16px}
.m-body{overflow:auto;padding:4px 20px 18px}
.s-sec{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:18px 0 6px;font-weight:600}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow>div:first-child{min-width:0;flex:1 1 150px}
.srow b{display:block;font-weight:600;font-size:14px}
.srow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.seg{display:flex;gap:2px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:11px;flex:none}
.segb{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;transition:.15s}
.segb:hover{color:var(--text)}
.segb.on{background:var(--card2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.segb svg.i{width:15px;height:15px}
.acct-box{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;flex-wrap:wrap}
.acct-box .who{flex:1 1 170px;min-width:0;display:flex;align-items:center;gap:12px}
.acct-box .av2{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--muted);flex:none}
.acct-box .who>div:last-child{min-width:0}
.acct-box b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-box small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.acct-box .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:10px;background:var(--card2);color:var(--text);font-weight:500;font-size:13px;transition:.15s}
.btn:hover{background:var(--line2)}
.btn svg.i{width:15px;height:15px}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.primary:hover{opacity:.88;background:var(--text)}
.btn.danger{color:#e5484d}

/* light theme overrides */
[data-theme="light"] body{background:#ececee}
[data-theme="light"] .newchat{background:#fff}
[data-theme="light"] kbd span{background:#e4e4e8;color:#63636b}
[data-theme="light"] .nav{color:#3f3f46}
[data-theme="light"] .nav.on,[data-theme="light"] .hi.on,[data-theme="light"] .chip:hover{color:#111}
[data-theme="light"] .hi{color:#52525b}
[data-theme="light"] .hi .del:hover{background:#dcdce0;color:#111}
[data-theme="light"] .acct b{color:#18181b}
[data-theme="light"] .pill{background:#ebebed}
[data-theme="light"] .pill:hover{background:#e0e0e4}
[data-theme="light"] .pill.light{background:#18181b;color:#fff}
[data-theme="light"] .pill.light:hover{background:#000}
[data-theme="light"] .chip{color:#3f3f46}
[data-theme="light"] .composer:focus-within{border-color:#b5b5bc;box-shadow:0 0 0 4px rgba(0,0,0,.04)}
[data-theme="light"] .composer textarea::placeholder{color:#9a9aa2}
[data-theme="light"] .model b{color:#27272a}
[data-theme="light"] .menu{background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.18)}
[data-theme="light"] .mi{color:#3f3f46}
[data-theme="light"] .mi b{color:#18181b}
[data-theme="light"] .fchip{color:#3f3f46}
[data-theme="light"] .fchip button:hover{background:#dcdce0;color:#111}
[data-theme="light"] .send{background:#dcdce0;color:#8a8a93}

[data-theme="light"] .md blockquote{color:#52525b}

[data-theme="light"] .err{color:#b91c1c;background:#fef2f2;border-color:#fecaca}

[data-theme="light"] ::-webkit-scrollbar-thumb{background:#cfcfd5;background-clip:padding-box}
[data-theme="light"] .modal{background:rgba(20,20,25,.35)}
[data-theme="light"] .modal-card{box-shadow:0 30px 90px rgba(0,0,0,.22)}
[data-theme="light"] .lv-dock{background:#fff;color:#18181b;box-shadow:0 12px 40px rgba(0,0,0,.2)}
[data-theme="light"] .lv-dock:hover{background:#f4f4f5}
.lv{--text:#ececec;--muted:#8e8e8e;--dim:#6a6a6a;--card:#1e1e1e;--card2:#2e2e2e;--line:#2a2a2a;--line2:#353535}
@media(max-width:760px){[data-theme="light"] .sb{background:#ececee}}

/* ===== effort slider ===== */
.menu{width:304px}
.eff{padding:12px 12px 10px;margin-top:4px;border-top:1px solid var(--line2)}
.eff-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.eff-t{font-weight:600;font-size:13px;color:var(--text)}
.eff-val{display:flex;align-items:center;gap:9px}
.eff-name{font-size:12.5px;font-weight:600;color:var(--ec,#4d8dff);display:inline-block;min-width:60px;text-align:right;white-space:nowrap}
.eff-name.pop,.eff-desc.pop{animation:effpop .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes effpop{0%{opacity:0;transform:translateY(7px) scale(.92)}100%{opacity:1;transform:none}}
.eff-meter{display:inline-flex;align-items:flex-end;gap:2px;height:14px;flex:none}
.eff-meter b{display:block;width:3px;border-radius:2px;background:var(--line2);transform-origin:bottom;transition:background .25s,transform .35s cubic-bezier(.34,1.56,.64,1);transition-delay:calc(var(--i,0)*35ms)}
.eff-meter b:nth-child(1){height:5px;--i:0}.eff-meter b:nth-child(2){height:7px;--i:1}.eff-meter b:nth-child(3){height:9px;--i:2}.eff-meter b:nth-child(4){height:11px;--i:3}.eff-meter b:nth-child(5){height:14px;--i:4}
.eff-meter b.on{background:var(--ec,#4d8dff);transform:scaleY(1.14)}
.eff-meter.mini{height:12px;gap:1.5px;margin:0 1px}
.eff-meter.mini b{width:2.5px}
.eff-track{position:relative;height:28px}
.eff-rail{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:4px;background:var(--line2);overflow:hidden}
.eff-fill{position:absolute;left:0;top:0;bottom:0;width:calc(9px + (100% - 18px) * var(--p,0));background:linear-gradient(90deg,#7bd3a8,var(--ec,#4d8dff));border-radius:4px;transition:width .45s cubic-bezier(.34,1.3,.64,1)}
.eff-ticks{position:absolute;left:0;right:0;top:14px;display:flex;justify-content:space-between;padding:0 9px;pointer-events:none}
.eff-ticks i{display:block;width:0;height:0;position:relative}
.eff-ticks i::after{content:"";position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--card);border:1.5px solid var(--line2);transition:background .3s,border-color .3s}
.eff-ticks i.on::after{background:var(--ec,#4d8dff);border-color:var(--ec,#4d8dff)}
.eff-in{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;background:transparent;touch-action:pan-y}
.eff-in::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:28px}
.eff-in::-moz-range-thumb{width:18px;height:28px;border:0}
.eff-thumb{position:absolute;top:5px;left:calc((100% - 18px) * var(--p,0));width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ec,#4d8dff);box-shadow:0 2px 8px rgba(0,0,0,.4);transition:left .45s cubic-bezier(.34,1.56,.64,1),border-color .3s;pointer-events:none}
.eff-in:focus-visible ~ .eff-thumb{outline:2px solid var(--accent);outline-offset:3px}
.eff-thumb.pulse{animation:effpulse .65s ease-out}
@keyframes effpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ec,#4d8dff) 65%,transparent),0 2px 8px rgba(0,0,0,.4)}100%{box-shadow:0 0 0 13px transparent,0 2px 8px rgba(0,0,0,.4)}}
.eff-lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:1px}
.eff-desc{display:block;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.45;min-height:35px}
.srow .seg{flex:0 1 auto;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
@media(prefers-reduced-motion:reduce){.eff *{transition:none!important;animation:none!important}}
</style>
</head>
