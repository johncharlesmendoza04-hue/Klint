/* ============ QUALITY GATE: run the page in a hidden sandbox, then patch real errors ============ */
const QA = (()=>{
  const IGN = /localstorage|sessionstorage|indexeddb|access is denied|securityerror|the operation is insecure|resizeobserver loop|script error\.?$|cookie|document is sandboxed|blocked a frame|not allowed to (navigate|load local)/i;
  const hook = id => '<script>(function(){var I=' + JSON.stringify(id) + ',P=function(t,m){try{parent.postMessage({qa:I,t:t,m:String(m).slice(0,260)},"*")}catch(e){}};'
    + 'addEventListener("error",function(e){var t=e.target;if(t&&t!==window&&(t.src||t.href)){P("res",t.src||t.href)}else{P("err",(e.message||"Error")+(e.lineno?" (line "+e.lineno+")":""))}},true);'
    + 'addEventListener("unhandledrejection",function(e){var r=e.reason;P("err","Unhandled promise rejection: "+(r&&r.message||r))});'
    + 'var ce=console.error;console.error=function(){P("log",[].slice.call(arguments).join(" "));ce.apply(console,arguments)};'
    + 'setTimeout(function(){var q=[].slice.call(document.querySelectorAll("button,[role=button],summary,[onclick]")).slice(0,10);q.forEach(function(b,i){setTimeout(function(){try{b.click()}catch(e){P("err","Click failed: "+e.message)}},i*110)});'
    + 'setTimeout(function(){["ArrowRight","ArrowLeft","ArrowUp","ArrowDown"," ","Enter"].forEach(function(k){try{var o={key:k,code:k===" "?"Space":k,bubbles:true};document.dispatchEvent(new KeyboardEvent("keydown",o));document.dispatchEvent(new KeyboardEvent("keyup",o))}catch(e){}})},q.length*110+120)},900);'
    + 'setTimeout(function(){try{var b=document.body;parent.postMessage({qa:I,t:"meta",len:((b&&b.innerText)||"").trim().length,txt:((b&&b.innerText)||"").slice(0,6000),canvas:document.querySelectorAll("canvas,img,video,iframe,object").length,svg:document.querySelectorAll("svg").length,sw:document.documentElement.scrollWidth,iw:innerWidth},"*")}catch(e){}},3000);})();<\/script>';
  const inject = (html, h) => /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m=>m+h) : /<html[^>]*>/i.test(html) ? html.replace(/<html[^>]*>/i, m=>m+h) : /^\s*<!doctype[^>]*>/i.test(html) ? html.replace(/^\s*<!doctype[^>]*>/i, m=>m+h) : h + html;
  function summarize(html, issues, meta){
    const errors = [], warns = [];
    if(/<!doctype|<html/i.test(html) && !/<\/html\s*>/i.test(html)) errors.push("The file looks cut off: there is no closing </html> tag.");
    if((html.match(/<script\b/gi)||[]).length !== (html.match(/<\/script\s*>/gi)||[]).length) errors.push("A <script> tag is not closed.");
    issues.forEach(x=>{ if(x.t==="err") errors.push(x.m); else if(x.t==="res") warns.push("Failed to load: " + x.m.replace(/^https?:\/\//,"").slice(0,90)); else if(x.t==="log") warns.push("console.error: " + x.m); });
    if(meta){
      if(meta.len<1 && !meta.canvas && !meta.svg) errors.push("The page rendered blank (no visible content).");
      const bad = (meta.txt||"").match(/\bundefined\b|\bNaN\b|\[object Object\]|\$\{[^}\n]{1,30}\}/);
      if(bad) warns.push("The page shows the text \"" + bad[0] + "\" (a variable was not filled in).");
      if(meta.sw > meta.iw + 4) warns.push("The page scrolls sideways at desktop width.");
    }
    return { errors:[...new Set(errors)].slice(0,5), warns:[...new Set(warns)].slice(0,4) };
  }
  return { fixing:false,
    run(html){ return new Promise(res=>{
      const id = "qa" + Math.random().toString(36).slice(2), f = document.createElement("iframe"), issues = [], seen = new Set(); let meta = null, done = false;
      f.setAttribute("sandbox","allow-scripts"); f.setAttribute("aria-hidden","true"); f.tabIndex = -1;
      f.style.cssText = "position:fixed;left:-10000px;top:0;width:1280px;height:800px;border:0;opacity:0;pointer-events:none";
      const on = e => {
        if(e.source!==f.contentWindow || !e.data || e.data.qa!==id) return;
        if(e.data.t==="meta"){ meta = e.data; fin(); return; }
        if(IGN.test(e.data.m)) return; const k = e.data.t + e.data.m; if(seen.has(k)) return; seen.add(k); issues.push({ t:e.data.t, m:e.data.m });
      };
      const fin = () => { if(done) return; done = true; removeEventListener("message", on); clearTimeout(tm); f.remove(); res(summarize(html, issues, meta)); };
      addEventListener("message", on);
      const tm = setTimeout(fin, 4500);
      f.srcdoc = inject(html, hook(id)); document.body.appendChild(f);
    }); }
  };
})();
const QAUI = {
  mount(msgEl){
    msgEl.querySelector(".qa")?.remove();
    const bot = msgEl.querySelector(".bot"); if(!bot) return null;
    const d = document.createElement("div"); d.className = "qa";
    d.innerHTML = `<div class="qa-h"><i class="qa-s"></i><span>Checking your page...</span></div>`;
    const anchor = bot.querySelector(".rcpt-row") || bot.querySelector(".msg-tools");
    if(anchor && anchor.nextSibling) bot.insertBefore(d, anchor.nextSibling); else bot.appendChild(d);
    return d;
  },
  show(d, qa, c, canFix, auto){
    if(!d) return;
    const e = qa.e||[], w = qa.w||[], n = e.length + w.length;
    d.className = "qa " + (e.length ? "bad" : w.length ? "warn" : "ok");
    const label = e.length ? e.length + " problem" + (e.length>1?"s":"") + " found" : w.length ? w.length + " thing" + (w.length>1?"s":"") + " to check" : "Page ran clean";
    d.innerHTML = `<button type="button" class="qa-h" ${n?"":"tabindex=\"-1\""}>${SVG(e.length||w.length ? "eye" : "check")}<span>${label}${auto ? " · fixing automatically..." : ""}</span></button>
      <div class="qa-l"><div><div class="qa-in">${e.map(x=>`<div class="row"><i></i><code>${esc(x)}</code></div>`).join("")}${w.map(x=>`<div class="row w"><i></i><code>${esc(x)}</code></div>`).join("")}
      ${canFix && e.length && !auto ? `<div class="qa-a"><button type="button" class="btn primary" data-q="fix">Fix automatically</button></div>` : ""}</div></div></div>`;
    d.querySelector(".qa-h").addEventListener("click", ()=>{ if(n) d.classList.toggle("open"); });
    const fb = d.querySelector('[data-q="fix"]'); if(fb) fb.addEventListener("click", ()=>QAUI.fix(c, qa));
  },
  restore(msgEl, qa, isLast){
    const d = QAUI.mount(msgEl); const c = chats.find(x=>x.id===cur);
    QAUI.show(d, qa, c, !!isLast, false);
  },
  fix(c, qa){
    if(busy || !c) return;
    const list = (qa.e||[]).map(x=>"- " + x).join("\n");
    QA.fixing = true;
    submit("An automatic quality check ran your page in a sandbox and found these problems:\n" + list + "\n\nFix only these problems with the smallest possible edits. Do not change anything else.", "Fix the " + (qa.e.length===1 ? "problem" : qa.e.length + " problems") + " found by the quality check");
  }
};
async function qaAfter(c, el, html, msg){
  if(!Budget.qaOn()) return;
  const d = QAUI.mount(el);
  let r; try{ r = await QA.run(html); }catch(_){ d && d.remove(); return; }
  if(!document.body.contains(el)){ return; }
  msg.qa = { e:r.errors, w:r.warns }; store.set(chats);
  const auto = r.errors.length && Budget.fixOn() && (c.qaTries||0) < 1 && cur===c.id && !busy;
  QAUI.show(d, msg.qa, c, true, !!auto);
  if(auto){ c.qaTries = (c.qaTries||0) + 1; setTimeout(()=>{ if(!busy && cur===c.id) QAUI.fix(c, msg.qa); }, 700); }
}

/* --- composer extras: prompt improver, voice dictation, prompt history --- */
const ENH_SYS = "You rewrite a user's rough request into a stronger prompt for an AI assistant that builds websites, apps, games and dashboards as single HTML files and also answers questions and writes code. Keep the user's intent, language and every explicit constraint. Add the missing specifics that make the result better: audience, key features, real content, visual style, interactions, edge cases and success criteria. Stay concrete, do not invent brand names and do not contradict the user. If the request is a question, make it precise and say what depth and format are wanted. Output ONLY the improved prompt as plain text, 40 to 140 words, with no preface, no quotes and no markdown.";
function setupExtraComposer(host, ta, fit){
  /* improve prompt */
  const enh = host.querySelector(".enh"), bar = document.createElement("div"); bar.className = "hint-row"; host.appendChild(bar);
  let prev = null, working = false;
  const hideBar = () => bar.classList.remove("show");
  const showBar = html => { bar.innerHTML = html; bar.classList.remove("show"); void bar.offsetWidth; bar.classList.add("show"); };
  const oldHide = host._hideHint; host._hideHint = () => { oldHide && oldHide(); hideBar(); };
  enh.addEventListener("click", async ()=>{
    if(working) return;
    const text = ta.value.trim();
    if(text.length < 4){ toast("Type a few words first, then improve them"); ta.focus(); return; }
    if(needsKey()){ promptForKey(); return; }
    working = true; enh.classList.add("busy"); showBar(`<span class="hint-t">${SVG("wand")}<span>Improving your prompt...</span></span>`);
    let out = ""; try{ out = await quickChat(ENH_SYS, "Mode: "+mode+"\n\nRequest:\n"+text, 30000); }catch(_){}
    out = out.replace(/^```[a-z]*\n?|```$/g,"").replace(/^["'`]+|["'`]+$/g,"").trim();
    working = false; enh.classList.remove("busy");
    if(out.length < 8){ showBar(`<span class="hint-t">${SVG("wand")}<span>Could not improve it. Check your key in Settings.</span></span><button type="button" class="icon-btn hint-x" data-e="x" aria-label="Dismiss">${SVG("x")}</button>`); return; }
    prev = text; ta.value = out; fit(); ta.focus();
    showBar(`<span class="hint-t">${SVG("wand")}<span>Prompt improved</span></span><button type="button" class="hint-go" data-e="undo">Undo</button><button type="button" class="icon-btn hint-x" data-e="x" aria-label="Dismiss">${SVG("x")}</button>`);
  });
  bar.addEventListener("pointerdown", e=>{
    const b = e.target.closest("[data-e]"); if(!b) return; e.preventDefault();
    if(b.dataset.e==="undo" && prev!=null){ ta.value = prev; fit(); prev = null; toast("Restored your original prompt"); }
    hideBar();
  });
  /* voice dictation */
  const mic = host.querySelector(".mic"), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  if(!SR){ mic.remove(); }
  else {
    host._stopRec = () => { try{ rec && rec.stop(); }catch(_){} };
    mic.addEventListener("click", ()=>{
      if(rec){ host._stopRec(); return; }
      let r; try{ r = new SR(); }catch(_){ toast("Voice input is not available here"); return; }
      const base = ta.value ? ta.value.replace(/\s*$/," ") : "";
      r.lang = navigator.language || "en-US"; r.interimResults = true; r.continuous = true;
      r.onresult = ev => { let t = ""; for(let i=0;i<ev.results.length;i++) t += ev.results[i][0].transcript; ta.value = base + t; fit(); };
      r.onerror = ev => { toast(/not-allowed|service-not-allowed/.test(ev.error) ? "Microphone access was blocked" : "Voice input stopped ("+ev.error+")"); };
      r.onend = () => { rec = null; mic.classList.remove("rec"); mic.title = "Dictate"; ta.focus(); };
      try{ r.start(); rec = r; mic.classList.add("rec"); mic.title = "Stop dictation"; toast("Listening..."); }catch(_){ toast("Could not start voice input"); }
    });
  }
  /* prompt history with the arrow keys */
  let hi = -1;
  host._pushHist = v => { if(v) pushHist(v); hi = -1; };
  ta.addEventListener("input", ()=>{ const H = phist(); if(hi<0 || ta.value!==H[hi]) hi = -1; });
  ta.addEventListener("keydown", e=>{
    if((e.key!=="ArrowUp" && e.key!=="ArrowDown") || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
    const H = phist(); if(!H.length) return;
    const empty = !ta.value.trim(), recalled = hi>=0 && ta.value===H[hi];
    if(!empty && !recalled) return;
    if(e.key==="ArrowUp"){ if(hi < H.length-1){ hi++; ta.value = H[hi]; fit(); e.preventDefault(); const L = ta.value.length; setTimeout(()=>ta.setSelectionRange(L,L),0); } }
    else if(hi>=0){ e.preventDefault(); if(hi>0){ hi--; ta.value = H[hi]; } else { hi = -1; ta.value = ""; } fit(); }
  });
}

function shrinkImage(file, max=1280){
  return new Promise((ok,no)=>{
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = ()=>{ const k = Math.min(1, max/Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg",.82)); };
    im.onerror = ()=>{ URL.revokeObjectURL(u); no(new Error("img")); };
    im.src = u;
  });
}

const Task = {
  el:null, n:0, pct:0, t:0,
  start(title, labels){
    clearTimeout(this.t); this.el?.remove(); this.n = labels.length; this.pct = 0;
    const e = this.el = document.createElement("div"); e.className = "thud";
    e.innerHTML = `<div class="thud-h"><b>${esc(title)}</b><em>0%</em><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div><div class="thud-bar"><div class="thud-fill"></div></div><ul class="thud-l">${labels.map(l=>`<li class="g"><i class="ic"><svg viewBox="0 0 16 16"><path d="M4 8.5l3 3 5.5-6"/></svg></i><span>${esc(l)}</span><small></small></li>`).join("")}</ul>`;
    e.querySelector(".thud-h").onclick = ()=>e.classList.toggle("col");
    document.body.appendChild(e);
  },
  set(i, st, sub){ const li = this.el?.querySelectorAll(".g")[i]; if(!li) return; li.className = "g "+st; li.querySelector("small").textContent = sub||""; },
  p(v){ if(!this.el) return; this.pct = Math.max(this.pct, Math.min(1, v)); this.el.querySelector(".thud-fill").style.width = (this.pct*100)+"%"; this.el.querySelector("em").textContent = Math.round(this.pct*100)+"%"; },
  go(i){ if(!this.el) return; this.el.querySelectorAll(".g").forEach((li,k)=>{ if(k<i && !li.classList.contains("done")) this.set(k,"done"); }); this.set(i,"active"); this.p(i/this.n); },
  wr(w, f){ const span = (w===this.n-1) ? 1 : this.n-1-w; this.p((w + f*span)/this.n); },
  finish(ok){
    if(!this.el) return; const e = this.el; clearTimeout(this.t);
    e.querySelectorAll(".g").forEach(li=>{ if(!li.classList.contains("done")) li.className = "g " + (ok?"done":(li.classList.contains("active")?"fail":"")); });
    if(ok){ this.p(1); e.classList.add("fin"); e.querySelector("b").textContent = "All done"; }
    else { e.classList.add("fin"); e.querySelector("b").textContent = "Stopped"; }
    this.t = setTimeout(()=>{ e.classList.add("out"); setTimeout(()=>{ if(this.el===e){ e.remove(); this.el = null; } }, 380); }, ok?2200:3200);
  }
};

const AG_ROLES = {1:["Builder"],2:["Planner","Builder"],3:["Planner","Builder","Critic"],4:["Researcher","Planner","Builder","Critic"],5:["Researcher","Planner","Builder","Critic","Polisher"]};

const AG = (()=>{ let o = {}; try{ o = JSON.parse(localStorage.getItem("klint_agent")||"{}") }catch{} return { on:!!o.on, n:Math.min(5,Math.max(1,o.n||3)), talk:Math.min(2,Math.max(0,o.talk??1)) }; })();
function syncAgent(){ const h = document.documentElement; h.dataset.agent = AG.on ? "1" : "0"; h.style.setProperty("--agn", '"'+AG.n+'"'); try{ localStorage.setItem("klint_agent", JSON.stringify(AG)); }catch{} }

    <label>Agents <em>${AG.n}</em></label><input type="range" class="msl" min="1" max="5" step="1" value="${AG.n}" style="--v:${(AG.n-1)*25}" data-t="n" aria-label="Number of agents">

function buildAgentTalk(log){
  const d = document.createElement("div"); d.className = "agt" + (log ? "" : " open");
  d.innerHTML = `<button type="button" class="agt-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;color:var(--muted);transform:none"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.2 19c.4-3.3 2.8-5.2 5.8-5.2s5.4 1.9 5.8 5.2"/><path d="M16 5.6a3 3 0 0 1 0 5.8M18 14c1.7.7 2.7 2.4 3 5"/></svg><span>Agent discussion</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><div class="agt-b"></div>`;

async function runAgents(c, talk, status){
  const n = AG.n, roles = AG_ROLES[n], rounds = n>1 ? AG_TALK[AG.talk][1] : 0, total = n*rounds;
  Task.start("Agent team \u00b7 "+n+(n>1?" agents":" agent"), [...roles, "Compose the answer"]);
  const ask = (c.messages[c.messages.length-1].content||"").slice(0,4000); const log = []; let done = 0;
  for(let r=1; r<=rounds; r++){
    for(let i=0; i<n; i++){
      if(abortFlag) return {log, n, total, notes:"", final:n};
      const role = roles[i];
      Task.set(i, "active", rounds>1 ? "Round "+r+" of "+rounds : "Working"); status.textContent = role+" is thinking...";
      const hist = log.map(m=>m.a+": "+m.t).join("\n\n");
      const sys = "You are the "+role+" on a small AI team helping the user. "+AG_DESC[role]+" Your teammates: "+roles.filter(x=>x!==role).join(", ")+". Talk directly to them by name. At most 110 words, no preamble, no headings. Do NOT write the final answer.";
      const user = "User request:\n"+ask+"\n\nTeam discussion so far:\n"+(hist||"(nothing yet)")+"\n\n"+(r>1 ? "This is round "+r+" of "+rounds+". React to specific points teammates made: agree, push back or refine." : "Give your contribution.");
      let t = ""; try{ t = await quickChat(sys, user, 60000); }catch(_){}
      if(t){ log.push({a:role, t, r}); talk.add(role, t, r); }
      done++; Task.set(i, r===rounds ? "done" : "pending", ""); Task.p(done/(total+1)*0.95);
    }
  }
  Task.set(n, "active", "Writing");
  const hist = log.map(m=>m.a+": "+m.t).join("\n\n");
  const notes = log.length ? "\n\n# Team notes (a private discussion between your agents; use the best points, resolve disagreements, never mention the team or quote them)\n"+hist : "";
  return {log, n, total, notes, final:n};
}

const GUI_HINT = "\n# Custom GUI controls (applies to any HTML interface you build)\nNever ship default browser controls. Every slider, toggle, button, select, checkbox, radio, stepper and tab bar must be custom-styled in a modern Apple (macOS and iOS) manner and must blend into the page's own theme.\n- Sliders (input type=range): appearance:none; 4px track with rounded ends; the filled part uses a --v percentage CSS variable updated in JS on input (and ::-moz-range-progress for Firefox); filled color comes from the theme (its accent or its text color), the unfilled part from the theme's border or a low-alpha tint of its text color. Thumb: 20 to 22px circle, white (or the theme's lightest surface), no visible border, layered soft shadows (0 0 0 .5px rgba(0,0,0,.14), 0 3px 8px rgba(0,0,0,.35)), grows to scale 1.15 on :active with a spring ease cubic-bezier(.3,1.6,.5,1). Add a focus-visible ring. Never leave the stock blue or grey native slider and never use a harsh pure-white track on a dark theme.\n- Buttons: pill or 10 to 12px radius, font-weight 590, subtle 0.5px inner border, press feedback scale(.95), hover brightness(1.1), focus-visible ring; one primary style (theme text color on theme background inverted, or the accent) and one quiet secondary style. Icons are inline SVG with stroke-linecap round, not emojis.\n- Toggles: iOS switch, 44 by 26px with a 22px thumb and spring transition. Segmented controls: inset rounded container with a sliding highlight. Selects, checkboxes and radios: fully custom (appearance:none).\n- Blend with the theme: derive every control color from the page's CSS variables (never invent unrelated colors), keep contrast accessible, set color-scheme to match, use the system font stack (SF Pro first), and animate with transitions of .15 to .35s using cubic-bezier(.2,1,.3,1).";
const MOTIVE_HINT = "\n# Plugin: Motive (active), Apple-style motion graphics\nYou are now a senior motion designer in the vein of Apple's keynote and product-page animation teams. Whenever the user wants an animation, motion graphic, logo reveal, kinetic type, title sequence, loader, explainer loop or any animated visual, deliver it as described below.\n\n## Output contract\n- Return ONE complete, self-contained HTML file in a single ```html block. No external scripts, images, fonts or network requests. Include <meta name='viewport'> and a <title>.\n- Motion must use ONLY CSS @keyframes, SVG and the Web Animations API. No canvas, no setTimeout, no requestAnimationFrame-driven motion, so the Motive player can pause, scrub, change speed and restart it.\n- Build ONE master timeline: every animated element uses the same --D duration (default 6s, or the length the user asked for), animation-iteration-count:infinite, animation-fill-mode:both, and its own keyframe percentages to choreograph when it enters, holds and exits. Use animation-delay only for tiny per-letter or per-word staggers (under 0.6s total).\n- Make the loop seamless: elements start hidden, enter in the first 40 percent, hold, and fade or blur out during the last 8 to 10 percent so the end matches the start.\n- Scale to any aspect ratio: a full-viewport stage (width 100vw, height 100vh, overflow hidden, container-type:size) with sizes in cqw/cqh or clamp(). Keep text inside safe margins of 8 percent. Never hard-code pixel layouts.\n\n## Visual language (Apple)\n- Stage: pure black #000 by default (or very dark #0b0b0f); light variant #f5f5f7 with #1d1d1f text only if the user asks for light.\n- Font: font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif; headlines weight 600 to 700, letter-spacing -0.03em to -0.04em, line-height 1.05; supporting text weight 400 to 500 in rgba(255,255,255,.6). Add -webkit-font-smoothing:antialiased. Use big type (headline around 7 to 12cqw) and very few words.\n- Color: mostly monochrome. One accent family at a time (blue #0a84ff to #64d2ff by default, or one the user names). Highlight a single word or phrase with a gradient fill (background-clip:text) that shifts from white to the accent. Never use rainbow or neon clutter.\n- Depth and light: 2 or 3 large blurred radial-gradient glows (filter:blur(60px to 120px), opacity .5 to .9) drifting slowly in the corners or behind the text, plus an optional faint vignette. Subtle only.\n- Copy: short, confident, Apple-keynote sentences ('Fast. Good. Free.', 'Meet Aurora.'). One idea per scene. 2 to 5 scenes maximum. No emojis, no lorem ipsum, no filler.\n\n## Motion language\n- Signature reveal: from opacity 0, translateY(14px to 28px), filter:blur(10px to 16px) to sharp, over 0.7 to 1.1s equivalent. Stagger letters or words by 40 to 90ms (use a --i variable on spans).\n- Easing: never linear and never plain ease. Use cubic-bezier(.16,1,.3,1) for entrances, cubic-bezier(.65,0,.35,1) for transitions between scenes, and cubic-bezier(.34,1.56,.64,1) only for small playful pops. Exits are faster than entrances.\n- Scene transitions: cross-dissolve with slight scale (0.96 to 1) and blur, or slide a word out upward while the next rises in. Overlap scenes by 10 to 15 percent so nothing feels like a hard cut.\n- Add one slow ambient motion under everything (glow drift, a gentle scale 1 to 1.04, or a light sweep across text) so frames never feel static. Keep hold moments calm.\n- Use transform and opacity (plus filter) for performance. Add will-change:transform,opacity,filter on animated layers. Respect @media (prefers-reduced-motion) by slowing durations, not removing the content.\n\n## Craft checklist (verify before answering)\n1. Looks premium frozen at ANY frame, with nothing clipped, overlapping or off-center.\n2. Text is crisp, high contrast, and readable for at least 0.8s per phrase.\n3. Loop is seamless and total duration matches the request const DEPTH_HINT = "\n# Plugin: Depth (active), 3D and WebGL\nWhenever the user wants 3D, a product viewer, a hero scene, particles, shaders or depth effects, build it for real with WebGL.\n- Use Three.js from cdnjs pinned to r128 (https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js, global THREE, no modules). OrbitControls is not in core, so write a small pointer-drag orbit with inertia and wheel or pinch zoom yourself. For pure backgrounds prefer a hand-written GLSL fragment shader on a full-screen quad (uniforms uTime, uRes, uMouse) with no library.\n- Setup: renderer.setPixelRatio(Math.min(devicePixelRatio,2)), antialias on, ACESFilmic tone mapping, sRGB output, ResizeObserver on the canvas parent, one requestAnimationFrame loop driven by THREE.Clock delta, never allocate objects inside the loop.\n- Look: hemisphere plus one key directional light with soft shadows (PCFSoftShadowMap), subtle fog, MeshStandardMaterial or MeshPhysicalMaterial with believable roughness and metalness, a gradient or procedural environment instead of external textures, no external models or images (build geometry from primitives, extrusions, lathes, instanced meshes and procedural canvas textures).\n- Interaction: pointer parallax or drag, hover highlight with Raycaster, smooth lerped camera moves, scroll-linked camera for landing pages.\n- Robustness: detect WebGL support and show a styled CSS fallback, pause rendering when the tab is hidden or the canvas is off screen (IntersectionObserver), cap particle counts on small screens, honour prefers-reduced-motion by slowing or freezing motion, dispose geometries and materials when replacing them.\n- Keep the surrounding UI crisp and readable above the canvas (z-index, contrast, pointer-events:none on decorative overlays).";
const SONIC_HINT = "\n# Plugin: Sonic (active), sound design with the Web Audio API\nWhenever the user wants a game, UI or interactive page, add tasteful procedural sound unless they say otherwise. No external audio files.\n- Create the AudioContext lazily and call resume() only inside a user gesture (first click, key or touch). Route everything through one master Gain into a DynamicsCompressor so nothing clips; keep individual effects at or below gain 0.3.\n- Provide a visible, keyboard-operable mute toggle and a volume slider (custom styled), persist both in localStorage inside try/catch, and start muted-safe: no sound before the first interaction. Pause or suspend audio on visibilitychange.\n- Build a tiny synth toolkit: envelope helper (attack, decay, sustain, release with exponentialRampToValueAtTime and a floor of 0.0001 to avoid clicks), tone(freq, type, dur, slide), noise burst with a filter, and a play(name) registry.\n- Design effects with intent: UI click (short 1.2 to 2 kHz blip, about 40ms), hover (barely audible), success (rising major arpeggio), error (low detuned buzz), coin (two quick high square notes), jump (upward pitch slide), hit and explosion (filtered noise plus a falling sine), whoosh (band-passed noise sweep). Keep every effect under 400ms and randomise pitch by a few percent so repeats do not fatigue. Rate-limit rapid repeats.\n- Music when relevant: a seamless procedural loop using a lookahead scheduler (setInterval about 25ms scheduling about 100ms ahead on audioContext.currentTime), a minor or pentatonic scale, bass, lead and a soft hi-hat, with a gentle low-pass so it sits behind effects. Never schedule with setTimeout for timing.\n- Make the mute control prominent and never autoplay loud audio.";
const ACCESS_HINT = "\n# Plugin: Access (active), accessibility first\nBuild everything to WCAG 2.2 AA at minimum and treat accessibility as part of the design, not an add-on.\n- Structure: lang on html, one h1, logical heading order, landmarks (header, nav, main, footer), a visible skip link, descriptive page title.\n- Colour: text contrast at least 4.5:1 (3:1 for 24px+ or 19px bold text and for UI boundaries and icons); verify the actual pairs you chose and never convey meaning by colour alone. Provide a visible focus ring of at least 3:1 contrast with focus-visible on every interactive element, never outline:none without a replacement.\n- Keyboard: every control reachable and operable by keyboard in a logical order; follow WAI-ARIA authoring patterns for tabs (arrow keys), accordion, menu, combobox and dialog (focus moves in, is trapped, Escape closes, focus returns to the trigger); use native elements first (button, a, input, details) and ARIA only to fill gaps.\n- Forms: a real label for every input, instructions and errors tied with aria-describedby, aria-invalid on bad fields, an error summary that receives focus, autocomplete attributes, no placeholder-only labels.\n- Feedback and media: aria-live (polite) for toasts and async results, role=status or alert as appropriate, alt text for meaningful images and aria-hidden for decorative SVG, captions or text alternatives for audio and video.\n- Motion and size: honour prefers-reduced-motion (swap movement for fades), no flashing above 3 per second, targets at least 44px (never below 24px), reflow without horizontal scroll at 320px and at 200 percent zoom, text resizable with rem units.\n- After the code block add a short \"Accessibility notes\" list (3 to 5 bullets) naming what you implemented and any known gaps or things to test with a screen reader.";

$("#navPlugins").onclick = ()=>{ openPlugins(); if(innerWidth<760) $("#sb").classList.add("hide"); };
$("#navMotive").onclick = ()=>{ openMotive(); if(innerWidth<760) $("#sb").classList.add("hide"); };
syncPlugins();
</script>
