  research: { label:"a research question",  name:"Research",   re:/\b(explain|compare|research|difference between|pros and cons|how does|why does|what is)\b/i }
};
const detectIntent = t => Object.keys(INTENT).find(k=>INTENT[k].re.test(t)) || null;

function setupSmartComposer(host, ta, fit){
  const sl = document.createElement("div"); sl.className = "slash"; sl.setAttribute("role","listbox"); host.appendChild(sl);
  const hintEl = document.createElement("div"); hintEl.className = "hint-row"; host.appendChild(hintEl);
  let slIdx = 0, slList = [], hintT = 0, hintMode = null, dismissed = false;
  const slClose = ()=>{ sl.classList.remove("open"); slList = []; };
  const hideHint = ()=>{ hintEl.classList.remove("show"); hintMode = null; };
  function slUpdate(){
    const m = ta.value.match(/^\/([a-z]*)$/i);
    if(!m){ slClose(); return false; }
    const q = m[1].toLowerCase(); slList = SLASH.filter(s=>s.cmd.startsWith(q));
    if(!slList.length){ slClose(); return false; }
    slIdx = Math.min(slIdx, slList.length-1);
    sl.innerHTML = slList.map((s,i)=>`<button type="button" class="sl ${i===slIdx?"on":""}" role="option" data-i="${i}">${SVG(s.icon)}<b>/${s.cmd}</b><span>${s.d}</span></button>`).join("");
    sl.classList.add("open"); hideHint(); return true;
  }
  function slRun(i){
    const s = slList[i]; if(!s) return;
    ta.value = ""; fit(); slClose(); hideHint(); s.run(); ta.focus();
  }
  sl.addEventListener("pointerdown", e=>{ const b = e.target.closest("[data-i]"); if(b){ e.preventDefault(); slRun(+b.dataset.i); } });
  ta.addEventListener("keydown", e=>{
    if(!sl.classList.contains("open")) return;
    if(e.key==="ArrowDown" || e.key==="ArrowUp"){ e.preventDefault(); slIdx = (slIdx + (e.key==="ArrowDown"?1:-1) + slList.length) % slList.length; slUpdate(); }
    else if(e.key==="Enter" || e.key==="Tab"){ e.preventDefault(); e.stopImmediatePropagation(); slRun(slIdx); }
    else if(e.key==="Escape"){ slClose(); }
  }, true);
  ta.addEventListener("blur", ()=>setTimeout(slClose,150));
  ta.addEventListener("input", ()=>{
    slIdx = 0; const open = slUpdate();
    clearTimeout(hintT);
    const v = ta.value.trim();
    if(!v){ dismissed = false; hideHint(); return; }
    if(open) return;
    hintT = setTimeout(()=>{
      const t = ta.value.trim();
      if(dismissed || mode!=="chat" || t.length<14 || t[0]==="/") return hideHint();
      const k = detectIntent(t); if(!k) return hideHint();
      if(hintMode===k && hintEl.classList.contains("show")) return;
      hintMode = k;
      hintEl.innerHTML = `<span class="hint-t">${SVG("spark")}<span>Looks like ${INTENT[k].label}</span></span><button type="button" class="hint-go" data-h="go">Use ${INTENT[k].name} mode</button><button type="button" class="icon-btn hint-x" data-h="x" title="Dismiss" aria-label="Dismiss">${SVG("x")}</button>`;
      hintEl.classList.remove("show"); void hintEl.offsetWidth; hintEl.classList.add("show");
    }, 450);
  });
  hintEl.addEventListener("pointerdown", e=>{
    const b = e.target.closest("[data-h]"); if(!b) return; e.preventDefault();
    if(b.dataset.h==="go" && hintMode){ const k = hintMode; hideHint(); setMode(k); ta.focus(); }
    else { dismissed = true; hideHint(); }
  });
  host._hideHint = ()=>{ hideHint(); slClose(); };
}

/* ============ PUTER SIGN-IN ============ */
/* true = signed in, false = signed out, null = unknown */
function authState(){
  try{
    if(typeof puter==="undefined" || !puter.auth) return null;
    const r = puter.auth.isSignedIn();
    if(r && typeof r.then==="function") return null;
    return !!r;
  }catch(_){ return null; }
}
const needsSignIn = () => provider()==="puter" && authState() === false;
function promptForKey(){
  toast(provider()==="openrouter" ? "Add your OpenRouter API key in Settings to start" : "Add your Gemini API key in Settings to start", 4000);
  openSettings();
  setTimeout(()=>{ const k = $("#orKey") || $("#gemKey"); if(k){ k.focus(); k.scrollIntoView({block:"center"}); } }, 80);
}
function authHints(){
  const h = [];
  if(location.protocol === "file:") h.push("This page is opened from a file. The Puter sign-in window cannot report back to a file page, so serve it over http(s), for example from localhost or any web host.");
  if(window.crossOriginIsolated) h.push("This page is cross-origin isolated (COOP/COEP headers), which blocks the Puter sign-in window. Turn those headers off for this server.");
  try{ if(window.self !== window.top) h.push("Klint is running inside a frame, where browsers often block the sign-in window. Open it in its own browser tab."); }
  catch(_){ h.push("Klint is running inside a frame, where browsers often block the sign-in window. Open it in its own browser tab."); }
  return h;
}
function authError(err){
  const code = String((err && (err.error && err.error.code || err.error || err.code)) || "").toLowerCase();
  const msg = String((err && (err.msg || err.message || (err.error && err.error.message))) || "");
  if(/popup/.test(code) || /popup/i.test(msg)) return "Your browser blocked the Puter sign-in window. Allow pop-ups for this page, then try again.";
  if(/closed/.test(code) || /closed/i.test(msg)) return "The Puter sign-in window was closed before it finished.";
  const h = authHints(); if(h.length) return h[0];
  return msg || code || "Puter sign-in failed. Try again.";
}
/* Must be called straight from a click or key press (before any await) so the browser lets the sign-in window open. */
let signingIn = null;
function signInFlow(){
  if(signingIn) return signingIn;
  if(typeof puter==="undefined" || !puter.auth){ toast("Puter could not be reached. Check your connection.", 5000); return Promise.resolve(false); }
  let p;
  try{ p = puter.auth.signIn(); }catch(e){ toast(authError(e), 7000); return Promise.resolve(false); }
  toast("Opening Puter sign-in...");
  signingIn = Promise.resolve(p).then(()=>{ toast("Signed in"); return true; }, err=>{ toast(authError(err), 7000); return false; }).finally(()=>{ signingIn = null; });
  return signingIn;
}
/* Switch account: signOut is synchronous, so signIn still counts as a direct click and the popup is allowed. */
async function switchAccount(){
  const prev = acct.user && acct.user.username;
  try{ puter.auth.signOut(); }catch(_){}
  const ok = await signInFlow();
  if(!ok){ refreshAccount(); return; }
  let u = null; try{ u = await puter.auth.getUser(); }catch(_){}
  acct = { user:u, err:"", loading:false, note:(u && prev && u.username===prev) ? "Puter signed you straight back into the same account because you are still logged in at puter.com. To use a different one, log out at puter.com (Manage), then press Switch again." : "" };
  paintAccount();
}

let acct = { user:null, err:"", loading:false, note:"" };
async function refreshAccount(){
  acct.loading = true; paintAccount();
  let user = null, err = "";
  try{
    if(typeof puter==="undefined" || !puter.auth) throw new Error("Puter could not be reached. Check your connection.");
    if(await puter.auth.isSignedIn()) user = await puter.auth.getUser();
  }catch(e){ err = (e && e.message) || "Puter could not be reached."; }
  acct = { user, err, loading:false, note:"" }; paintAccount();
}
function paintAccount(){
  const box = $("#acctBox"); if(!box) return;
  const who = (title, sub) => `<div class="who"><div class="av2">${SVG("user")}</div><div><b>${esc(title)}</b><small>${esc(sub)}</small></div></div>`;
  if(acct.loading){ box.innerHTML = who("Checking account...","Talking to Puter"); return; }
  const notes = (acct.note ? [acct.note] : []).concat(authHints()).map(t=>`<div class="acct-note">${esc(t)}</div>`).join("");
  if(acct.err){
    box.innerHTML = who("Puter unavailable", acct.err) + `<div class="btns"><button type="button" class="btn" data-s="acct-refresh">${SVG("refresh")}Retry</button></div>` + notes;
    return;
  }
  if(acct.user){
    const u = acct.user.username || "Puter user";
    box.innerHTML = who(u, "Signed in with Puter") +
      `<div class="btns"><button type="button" class="btn" data-s="acct-switch">${SVG("refresh")}Switch</button>` +
      `<button type="button" class="btn" data-s="acct-manage">${SVG("external")}Manage</button>` +
      `<button type="button" class="btn danger" data-s="acct-out">${SVG("logout")}Sign out</button></div>` + notes;

      `<div class="btns"><button type="button" class="btn primary" data-s="acct-in">${SVG("login")}Sign in</button></div>` + notes;
  }
}

const REQ = { ut:"", kind:"", lean:false, gui:false, cat:null };

/* --- 1. plugin hints are sent only when the request can use them (the Motive block alone is ~1.1k tokens) --- */
const PL_RE = {
  motive:/\b(animat\w*|motion|kinetic|logo reveal|title sequence|loader|spinner|intro|outro|looping|keyframes?|lottie|motive|explainer)\b/i,
  depth:/\b(3d|three\.?js|webgl|shader|glsl|particles?|orbit|product viewer|globe|hero scene)\b/i,
  sonic:/\b(sound|audio|music|sfx|synth|soundtrack|beep|mute)\b/i,
  access:/\b(access\w*|a11y|aria|wcag|keyboard|contrast|focus|form|screen reader)\b/i
};
function plHintsFor(){
  const t = REQ.ut || "", build = REQ.kind === "build";
  let out = "";
  if(plOn("motive") && PL_RE.motive.test(t)) out += MOTIVE_HINT;

/* --- 5. patch repair: re-align only the blocks that missed, instead of rewriting the whole file --- */
const Repair = (()=>{
  const toks = s => new Set((s.match(/[A-Za-z0-9_#.\-]+/g) || []).map(x => x.toLowerCase()));
  const sim = (a, b) => { if(!a.size || !b.size) return 0; let n = 0; a.forEach(x => { if(b.has(x)) n++; }); return n / (a.size + b.size - n); };
  /* find the stretch of the file that looks most like the missed SEARCH text (fuzzy, line by line) */
  function region(doc, search){
    const sl = search.split("\n"), st = sl.map(toks), dl = doc.split("\n"), dt = dl.map(toks), n = sl.length;
    let best = 0, at = -1;
    for(let a = 0; a < dl.length; a++){ let s = 0; for(let b = 0; b < n && a + b < dl.length; b++) s += sim(dt[a+b], st[b]); if(s > best){ best = s; at = a; } }
    if(at < 0 || best < 0.1 * n) return null;
    return dl.slice(Math.max(0, at-3), Math.min(dl.length, at + n + 3)).join("\n");
  }
  async function run(base, full, R0){
    const fails = R0.failedBlocks.slice(0,4), parts = [];
    for(let i = 0; i < fails.length; i++){
      const r = region(base, fails[i].search); if(!r) return null;
      parts.push("## Block " + (i+1) + "\nIntended replacement:\n" + fails[i].replace + "\n\nSEARCH that did not match:\n" + fails[i].search + "\n\nReal file region:\n" + r);
    }
    const sys = "You repair edit patches. For each numbered block the SEARCH text did not match the file. Re-emit each block with SEARCH copied character for character from the real file region (a few lines are enough) and the same intended replacement. Output exactly " + fails.length + " block(s), in order, inside one ```patch fence, using <<<<<<< SEARCH, =======, >>>>>>> REPLACE. Nothing else.";
    let buf = "", pe = effort; effort = 1;
    try{ await streamAI([{role:"user", content:parts.join("\n\n")}], t => { buf += t; }, sys); } catch(_){ return null; } finally { effort = pe; }
    const nb = Patch.blocks(buf);
    if(nb.length !== fails.length) return null;
    let out = full;
    for(let i = 0; i < fails.length; i++){
      if(!fails[i].raw || out.indexOf(fails[i].raw) < 0) return null;
      out = out.replace(fails[i].raw, () => nb[i].raw);
    }
    const chk = Patch.resolve(base, out);
    return (chk.total && !chk.failed.length) ? out : null;
  }
  return { run };
})();

const COMPACT_SYS = "You are Klint Maximal, an AI assistant made by Taskbound. Be accurate, direct and genuinely helpful. Lead with the answer and keep it as short as the question allows. Use Markdown only when it helps (lists, tables, fenced code with a language tag). For code questions give minimal, correct, runnable examples and mention edge cases briefly. If the user asks you to build a website, app, game or dashboard, deliver ONE complete self-contained HTML file in a single ```html block with a polished modern design, responsive layout, accessible controls and working interactions. If you are unsure, say so; never invent facts, sources or URLs. You cannot browse the web.";
const Usage = (()=>{
  const KEY = "klint_usage", day = () => new Date().toLocaleDateString("en-CA");
  const load = () => { try{ return JSON.parse(localStorage.getItem(KEY)||"{}") }catch{ return {} } };
  const S = { in:0, out:0, cached:0, usd:0, savedUsd:0, savedTok:0, reqs:0 };
  let R = null;
  const bump = d => { const all = load(), k = day(), t = all[k] || { in:0, out:0, cached:0, usd:0, savedUsd:0, savedTok:0, reqs:0 };
    for(const x in d) t[x] = (t[x]||0) + d[x]; all[k] = t;
    const ks = Object.keys(all).sort(); while(ks.length>30) delete all[ks.shift()];
    try{ localStorage.setItem(KEY, JSON.stringify(all)); }catch{} };
  return {
    S, begin(){ R = { in:0, out:0, think:0, cached:0, usd:0, calls:0 }; },
    take(){ const r = R || { in:0, out:0, think:0, cached:0, usd:0, calls:0 }; R = null; return r; },
    note(model, u){
      if(!u) return;
      const th = u.thoughtsTokenCount||0, i = u.promptTokenCount||0, o = (u.candidatesTokenCount||0) + th, c = Math.min(i, u.cachedContentTokenCount||0), p = priceFor(model);
      const usd = ((i-c)*p.i + c*p.c + o*p.o)/1e6;
      S.in += i; S.out += o; S.cached += c; S.usd += usd; bump({ in:i, out:o, cached:c, usd, reqs:1 });
      if(R){ R.in += i; R.out += o; R.think += th; R.cached += c; R.usd += usd; R.calls++; }
      Budget.refreshPanel();
    },
    saved(tok, usd){ if(!(tok>0)) return; S.savedTok += tok; S.savedUsd += usd; bump({ savedTok:tok, savedUsd:usd }); },
    today(){ return load()[day()] || { in:0, out:0, cached:0, usd:0, savedUsd:0, savedTok:0, reqs:0 }; }
  };
})();

const Budget = (()=>{

  const mk = () => { const v = get("mode","balanced"); return MODEDEF[v] ? v : "balanced"; };
  const def = () => MODEDEF[mk()];
  const flag = (k,d) => { const v = get(k,""); return v==="" ? d : v==="on"; };
  const autoOn = () => flag("auto", true), qaOn = () => flag("qa", true), fixOn = () => qaOn() && flag("fix", def().fix);
  const VERB = /\b(build|make|create|design|generate|develop|code|implement|program|draw|animate|prototype)\b/i;
  const NOUN = /\b(web ?site|web ?page|page|landing|app|application|game|dashboard|component|html|css|ui|ux|tool|calculator|portfolio|form|animation|clone|widget|chart|tracker|timer|todo|to-do|quiz|menu|navbar|hero|template|layout|script|bot|simulation|visuali[sz]ation|store|shop|blog|platformer|snake|tetris|pong)\b/i;
  const STRONG = /\b(landing page|html file|single[- ]file|web ?site|dashboard)\b/i;
  const HEAVY = /\b(full|complete|complex|advanced|multi-?(player|page|step)|3d|webgl|three\.?js|physics|shader|e-?commerce|saas|admin|crm|kanban|editor|simulation|realistic|production|real-?time|drag and drop|platformer|rpg|full-?stack|authentication|inventory)\b/i;
  const TINY = /\b(colou?r|font|size|bigger|smaller|larger|text|title|heading|label|padding|margin|spacing|rename|typo|move|hide|show|remove|swap|round(ed)?|bold|shadow|border|align|center|position|width|height|gap|icon|logo|image|button)\b/i;
  const ASK = /^\s*(what|why|how|which|where|when|who|can you (explain|tell)|explain|does|is|are|do)\b/i;
  const DEEP = /\b(compare|analy[sz]e|explain in detail|step by step|pros and cons|in depth|essay|detailed|research|strategy|architecture|trade-?offs?)\b/i;
  const KIND = { qa:"a question", edit:"an edit", build:"a new build" };
  const chars = msgs => msgs.reduce((n,m)=>n+(m.content||"").length, 0);

  }
  const api = {
    get mode(){ return mk(); }, def, autoOn, qaOn, fixOn, get last(){ return last; }, get cur(){ return cur; },

    planOK(){ return cur ? cur.planOK : true; },
    compactSystem(plan){
      return COMPACT_SYS + TIERS[tier].hint + kxHint(true) + customBlock() + "\n\n# Effort level: " + EFFORTS[effort].name + "\n" + EFFORTS[effort].hint
        + (plan ? "\n\n# Private plan (never mention it)\n" + plan.slice(0,3500) : "");
    },
    begin(c, x){
      Usage.begin();
      const ut = x.ut||"", M = def(), user = effort;
      const kind = x.editMode ? "edit" : (mode!=="chat" || ROUTED || REQ.cat || x.wantsRemake || (VERB.test(ut) && NOUN.test(ut)) || STRONG.test(ut) || /```|\[Attached file:/.test(ut)) ? "build" : "qa";
      const heavy = HEAVY.test(ut) || ut.length>350 || /\[Attached file:/.test(ut);
      let L;
      if(kind==="qa"){
        L = (ut.length<180 && !DEEP.test(ut)) ? 0 : 1;

    trim(msgs){

    end(full){

      const U = { kind:c.kind, E:EFFORTS[c.E].name, user:EFFORTS[c.user].name, in:R.in, out:R.out, think:R.think, cached:R.cached, usd:R.usd, calls:R.calls, est:false, free:!isG, notes:c.notes.slice(), model, ms:Math.round(performance.now()-c.t0) };
      if(!R.calls){ U.est = true; U.in = Math.round(c.inChars/4); U.out = Math.round((full||"").length/4); U.usd = 0; }
      const p = priceFor(model), sUsd = isG ? (c.saveIn*p.i + c.saveOut*p.o)/1e6 : 0;

    },
    title(c){
      if(!def().local){ return makeTitle(c); }
      const u = c.messages[0]; if(!u) return Promise.resolve();
      let t = String(u.shown||u.content||"").replace(/\[Attached file:[\s\S]*$/,"").replace(/\s+/g," ").trim();
      t = t.replace(/^(please|pls|hey|hi|hello|ok|okay|can you|could you|would you|i want you to|i want|i need|i'd like|help me|make me|build me|create me|give me|write me|show me)\s+/ig,"").replace(/^(a|an|the)\s+/i,"");
      t = t.split(/[.?!\n]/)[0].split(" ").slice(0,6).join(" ").replace(/[,;:\-\s]+$/,"");
      if(t.length>40) t = t.slice(0,40).replace(/\s+\S*$/,"");
      if(t.length<3) return Promise.resolve();
      c.title = t.charAt(0).toUpperCase() + t.slice(1); store.set(chats); renderHist(); typeTitle(c.id);
      const pr = priceFor(gemModel()); Usage.saved(510, provider()==="gemini" ? (500*pr.i + 10*pr.o)/1e6 : 0);

    },
    setMode(k){ if(!MODEDEF[k]) return; set("mode",k); api.paint(); api.refreshPanel(); toast("Budget: " + MODEDEF[k].name + " (" + MODEDEF[k].tag + ")"); },

const QA = (()=>{
  const IGN = /localstorage|sessionstorage|indexeddb|access is denied|securityerror|the operation is insecure|resizeobserver loop|script error\.?$|cookie|document is sandboxed|blocked a frame|not allowed to (navigate|load local)/i;
  const hook = id => '<script>(function(){var I=' + JSON.stringify(id) + ',P=function(t,m){try{parent.postMessage({qa:I,t:t,m:String(m).slice(0,260)},"*")}catch(e){}};'
    + 'addEventListener("error",function(e){var t=e.target;if(t&&t!==window&&(t.src||t.href)){P("res",t.src||t.href)}else{P("err",(e.message||"Error")+(e.lineno?" (line "+e.lineno+")":""))}},true);'
    + 'addEventListener("unhandledrejection",function(e){var r=e.reason;P("err","Unhandled promise rejection: "+(r&&r.message||r))});'
    + 'var ce=console.error;console.error=function(){P("log",[].slice.call(arguments).join(" "));ce.apply(console,arguments)};'
    + 'setTimeout(function(){var q=[].slice.call(document.querySelectorAll("button,[role=button],summary,[onclick]")).slice(0,10);q.forEach(function(b,i){setTimeout(function(){try{b.click()}catch(e){P("err","Click failed: "+e.message)}},i*110)});'
    + 'setTimeout(function(){["ArrowRight","ArrowLeft","ArrowUp","ArrowDown"," ","Enter"].forEach(function(k){try{var o={key:k,code:k===" "?"Space":k,bubbles:true};document.dispatchEvent(new KeyboardEvent("keydown",o));document.dispatchEvent(new KeyboardEvent("keyup",o))}catch(e){}})},q.length*110+120)},900);'
    + 'setTimeout(function(){try{var b=document.body;parent.postMessage({qa:I,t:"meta",len:((b&&b.innerText)||"").trim().length,txt:((b&&b.innerText)||"").slice(0,6000),canvas:document.querySelectorAll("canvas,img,video,iframe,object").length,svg:document.querySelectorAll("svg").length,sw:document.documentElement.scrollWidth,iw:innerWidth},"*")}catch(e){}},3000);})();<\/script>';
  const inject = (html, h) => /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m=>m+h) : /<html[^>]*>/i.test(html) ? html.replace(/<html[^>]*>/i, m=>m+h) : /^\s*<!doctype[^>]*>/i.test(html) ? html.replace(/^\s*<!doctype[^>]*>/i, m=>m+h) : h + html;
  function summarize(html, issues, meta){
    const errors = [], warns = [];
    if(/<!doctype|<html/i.test(html) && !/<\/html\s*>/i.test(html)) errors.push("The file looks cut off: there is no closing </html> tag.");
    if((html.match(/<script\b/gi)||[]).length !== (html.match(/<\/script\s*>/gi)||[]).length) errors.push("A <script> tag is not closed.");
    issues.forEach(x=>{ if(x.t==="err") errors.push(x.m); else if(x.t==="res") warns.push("Failed to load: " + x.m.replace(/^https?:\/\//,"").slice(0,90)); else if(x.t==="log") warns.push("console.error: " + x.m); });
    if(meta){
      if(meta.len<1 && !meta.canvas && !meta.svg) errors.push("The page rendered blank (no visible content).");
      const bad = (meta.txt||"").match(/\bundefined\b|\bNaN\b|\[object Object\]|\$\{[^}\n]{1,30}\}/);
      if(bad) warns.push("The page shows the text \"" + bad[0] + "\" (a variable was not filled in).");
      if(meta.sw > meta.iw + 4) warns.push("The page scrolls sideways at desktop width.");
    }
    return { errors:[...new Set(errors)].slice(0,5), warns:[...new Set(warns)].slice(0,4) };
  }
  return { fixing:false,
    run(html){ return new Promise(res=>{
      const id = "qa" + Math.random().toString(36).slice(2), f = document.createElement("iframe"), issues = [], seen = new Set(); let meta = null, done = false;
      f.setAttribute("sandbox","allow-scripts"); f.setAttribute("aria-hidden","true"); f.tabIndex = -1;
      f.style.cssText = "position:fixed;left:-10000px;top:0;width:1280px;height:800px;border:0;opacity:0;pointer-events:none";
      const on = e => {
        if(e.source!==f.contentWindow || !e.data || e.data.qa!==id) return;
        if(e.data.t==="meta"){ meta = e.data; fin(); return; }
        if(IGN.test(e.data.m)) return; const k = e.data.t + e.data.m; if(seen.has(k)) return; seen.add(k); issues.push({ t:e.data.t, m:e.data.m });
      };
      const fin = () => { if(done) return; done = true; removeEventListener("message", on); clearTimeout(tm); f.remove(); res(summarize(html, issues, meta)); };
      addEventListener("message", on);
      const tm = setTimeout(fin, 4500);
      f.srcdoc = inject(html, hook(id)); document.body.appendChild(f);
    }); }
  };
})();
const QAUI = {
  mount(msgEl){
    msgEl.querySelector(".qa")?.remove();
    const bot = msgEl.querySelector(".bot"); if(!bot) return null;
    const d = document.createElement("div"); d.className = "qa";
    d.innerHTML = `<div class="qa-h"><i class="qa-s"></i><span>Checking your page...</span></div>`;
    const anchor = bot.querySelector(".rcpt-row") || bot.querySelector(".msg-tools");
    if(anchor && anchor.nextSibling) bot.insertBefore(d, anchor.nextSibling); else bot.appendChild(d);
    return d;
  },
  show(d, qa, c, canFix, auto){
    if(!d) return;
    const e = qa.e||[], w = qa.w||[], n = e.length + w.length;
    d.className = "qa " + (e.length ? "bad" : w.length ? "warn" : "ok");
    const label = e.length ? e.length + " problem" + (e.length>1?"s":"") + " found" : w.length ? w.length + " thing" + (w.length>1?"s":"") + " to check" : "Page ran clean";
    d.innerHTML = `<button type="button" class="qa-h" ${n?"":"tabindex=\"-1\""}>${SVG(e.length||w.length ? "eye" : "check")}<span>${label}${auto ? " · fixing automatically..." : ""}</span></button>
      <div class="qa-l"><div><div class="qa-in">${e.map(x=>`<div class="row"><i></i><code>${esc(x)}</code></div>`).join("")}${w.map(x=>`<div class="row w"><i></i><code>${esc(x)}</code></div>`).join("")}
      ${canFix && e.length && !auto ? `<div class="qa-a"><button type="button" class="btn primary" data-q="fix">Fix automatically</button></div>` : ""}</div></div></div>`;
    d.querySelector(".qa-h").addEventListener("click", ()=>{ if(n) d.classList.toggle("open"); });
    const fb = d.querySelector('[data-q="fix"]'); if(fb) fb.addEventListener("click", ()=>QAUI.fix(c, qa));
  },
  restore(msgEl, qa, isLast){
    const d = QAUI.mount(msgEl); const c = chats.find(x=>x.id===cur);
    QAUI.show(d, qa, c, !!isLast, false);
  },
  fix(c, qa){
    if(busy || !c) return;
    const list = (qa.e||[]).map(x=>"- " + x).join("\n");
    QA.fixing = true;
    submit("An automatic quality check ran your page in a sandbox and found these problems:\n" + list + "\n\nFix only these problems with the smallest possible edits. Do not change anything else.", "Fix the " + (qa.e.length===1 ? "problem" : qa.e.length + " problems") + " found by the quality check");
  }
};
async function qaAfter(c, el, html, msg){
  if(!Budget.qaOn()) return;
  const d = QAUI.mount(el);
  let r; try{ r = await QA.run(html); }catch(_){ d && d.remove(); return; }
  if(!document.body.contains(el)){ return; }
  msg.qa = { e:r.errors, w:r.warns }; store.set(chats);
  const auto = r.errors.length && Budget.fixOn() && (c.qaTries||0) < 1 && cur===c.id && !busy;
  QAUI.show(d, msg.qa, c, true, !!auto);
  if(auto){ c.qaTries = (c.qaTries||0) + 1; setTimeout(()=>{ if(!busy && cur===c.id) QAUI.fix(c, msg.qa); }, 700); }
}

const ENH_SYS = "You rewrite a user's rough request into a stronger prompt for an AI assistant that builds websites, apps, games and dashboards as single HTML files and also answers questions and writes code. Keep the user's intent, language and every explicit constraint. Add the missing specifics that make the result better: audience, key features, real content, visual style, interactions, edge cases and success criteria. Stay concrete, do not invent brand names and do not contradict the user. If the request is a question, make it precise and say what depth and format are wanted. Output ONLY the improved prompt as plain text, 40 to 140 words, with no preface, no quotes and no markdown.";
function setupExtraComposer(host, ta, fit){
  /* improve prompt */
  const enh = host.querySelector(".enh"), bar = document.createElement("div"); bar.className = "hint-row"; host.appendChild(bar);
  let prev = null, working = false;
  const hideBar = () => bar.classList.remove("show");
  const showBar = html => { bar.innerHTML = html; bar.classList.remove("show"); void bar.offsetWidth; bar.classList.add("show"); };
  const oldHide = host._hideHint; host._hideHint = () => { oldHide && oldHide(); hideBar(); };
  enh.addEventListener("click", async ()=>{
    if(working) return;
    const text = ta.value.trim();
    if(text.length < 4){ toast("Type a few words first, then improve them"); ta.focus(); return; }
    if(needsKey()){ promptForKey(); return; }
    working = true; enh.classList.add("busy"); showBar(`<span class="hint-t">${SVG("wand")}<span>Improving your prompt...</span></span>`);
    let out = ""; try{ out = await quickChat(ENH_SYS, "Mode: "+mode+"\n\nRequest:\n"+text, 30000); }catch(_){}
    out = out.replace(/^```[a-z]*\n?|```$/g,"").replace(/^["'`]+|["'`]+$/g,"").trim();
    working = false; enh.classList.remove("busy");
    if(out.length < 8){ showBar(`<span class="hint-t">${SVG("wand")}<span>Could not improve it. Check your key in Settings.</span></span><button type="button" class="icon-btn hint-x" data-e="x" aria-label="Dismiss">${SVG("x")}</button>`); return; }
    prev = text; ta.value = out; fit(); ta.focus();
    showBar(`<span class="hint-t">${SVG("wand")}<span>Prompt improved</span></span><button type="button" class="hint-go" data-e="undo">Undo</button><button type="button" class="icon-btn hint-x" data-e="x" aria-label="Dismiss">${SVG("x")}</button>`);
  });
  bar.addEventListener("pointerdown", e=>{
    const b = e.target.closest("[data-e]"); if(!b) return; e.preventDefault();
    if(b.dataset.e==="undo" && prev!=null){ ta.value = prev; fit(); prev = null; toast("Restored your original prompt"); }
    hideBar();
  });
  /* voice dictation */
  const mic = host.querySelector(".mic"), SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  if(!SR){ mic.remove(); }
  else {
    host._stopRec = () => { try{ rec && rec.stop(); }catch(_){} };
    mic.addEventListener("click", ()=>{
      if(rec){ host._stopRec(); return; }
      let r; try{ r = new SR(); }catch(_){ toast("Voice input is not available here"); return; }
      const base = ta.value ? ta.value.replace(/\s*$/," ") : "";
      r.lang = navigator.language || "en-US"; r.interimResults = true; r.continuous = true;
      r.onresult = ev => { let t = ""; for(let i=0;i<ev.results.length;i++) t += ev.results[i][0].transcript; ta.value = base + t; fit(); };
      r.onerror = ev => { toast(/not-allowed|service-not-allowed/.test(ev.error) ? "Microphone access was blocked" : "Voice input stopped ("+ev.error+")"); };
      r.onend = () => { rec = null; mic.classList.remove("rec"); mic.title = "Dictate"; ta.focus(); };
      try{ r.start(); rec = r; mic.classList.add("rec"); mic.title = "Stop dictation"; toast("Listening..."); }catch(_){ toast("Could not start voice input"); }
    });
  }
  /* prompt history with the arrow keys */
  let hi = -1;
  host._pushHist = v => { if(v) pushHist(v); hi = -1; };
  ta.addEventListener("input", ()=>{ const H = phist(); if(hi<0 || ta.value!==H[hi]) hi = -1; });
  ta.addEventListener("keydown", e=>{
    if((e.key!=="ArrowUp" && e.key!=="ArrowDown") || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
    const H = phist(); if(!H.length) return;
    const empty = !ta.value.trim(), recalled = hi>=0 && ta.value===H[hi];
    if(!empty && !recalled) return;
    if(e.key==="ArrowUp"){ if(hi < H.length-1){ hi++; ta.value = H[hi]; fit(); e.preventDefault(); const L = ta.value.length; setTimeout(()=>ta.setSelectionRange(L,L),0); } }
    else if(hi>=0){ e.preventDefault(); if(hi>0){ hi--; ta.value = H[hi]; } else { hi = -1; ta.value = ""; } fit(); }
  });
}

const Cmdk = (()=>{
  let el, inp, listEl, items = [], flat = [], idx = 0, grouped = true;

  const score = (q,t) => { q = q.toLowerCase(); t = t.toLowerCase(); if(!q) return 1; const i = t.indexOf(q); if(i>=0) return 200-i; let last = -1, gap = 0; for(const ch of q){ const j = t.indexOf(ch,last+1); if(j<0) return -1; gap += j-last-1; last = j; } return 100-gap; };
  const openChat = id => { if(busy) return toast("Wait for the reply to finish"); cur = id; renderChat(); if(innerWidth<760) $("#sb").classList.add("hide"); };
  function gather(){

    A("Actions","Keyboard shortcuts","keys",openShortcuts,"?");

    Object.keys(MODEDEF).forEach(k=>A("Budget","Budget: "+MODEDEF[k].name+" ("+MODEDEF[k].tag+")","bolt",()=>Budget.setMode(k)));
    A("Budget","Usage, cost and savings","bolt",()=>Budget.openPanel());
    Object.keys(MODES).forEach(k=>A("Modes","Mode: "+MN[k],MODES[k].icon,()=>{ if(mode!==k) setMode(k); }));
    EFFORTS.forEach((e,i)=>A("Effort","Effort: "+e.name,"bolt",()=>{ setEffort(i); toast("Effort: "+e.name); }));
    Object.entries(TIERS).forEach(([k,t])=>A("Model",t.name,t.icon,()=>{ tier = k; PREFS.set("tier",k); document.querySelectorAll(".composer-wrap").forEach(h=>h._paintModel && h._paintModel()); toast(t.name+" selected"); }));

    chats.slice().reverse().slice(0,30).forEach(ch=>o.push({g:"Chats",t:ch.title,i:"bubble",hint:ch.pinned?"Pinned":"",run:()=>openChat(ch.id)}));
    return o;
  }
  function build(){
    el = document.createElement("div"); el.className = "cmdk";
    el.innerHTML = `<div class="cmdk-card" role="dialog" aria-modal="true" aria-label="Command palette"><div class="cmdk-in">${SVG("search")}<input type="text" placeholder="Search chats, switch modes, run commands..." autocomplete="off" spellcheck="false" aria-label="Command palette search"><kbd><span>Esc</span></kbd></div><div class="cmdk-l" role="listbox"></div><div class="cmdk-foot"><span>Up and Down to move</span><span>Enter to run</span><span>Esc to close</span></div></div>`;
    document.body.appendChild(el); inp = el.querySelector("input"); listEl = el.querySelector(".cmdk-l");
    el.addEventListener("pointerdown", e=>{ if(e.target===el) close(); });

    listEl.addEventListener("pointermove", e=>{ const b = e.target.closest("[data-i]"); if(b && +b.dataset.i!==idx){ idx = +b.dataset.i; mark(false); } });
  }

    const q = inp.value.trim(); grouped = !q;

})();

function shrinkImage(file, max=1280){
  return new Promise((ok,no)=>{
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = ()=>{ const k = Math.min(1, max/Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg",.82)); };
    im.onerror = ()=>{ URL.revokeObjectURL(u); no(new Error("img")); };
    im.src = u;
  });
}

const AG_ROLES = {1:["Builder"],2:["Planner","Builder"],3:["Planner","Builder","Critic"],4:["Researcher","Planner","Builder","Critic"],5:["Researcher","Planner","Builder","Critic","Polisher"]};

const AG_DESC = {Researcher:"You gather facts, constraints, edge cases and references the team needs. Be specific.",Planner:"You break the request into a clear plan: goals, structure, key decisions and risks.",Builder:"You propose the concrete solution: structure, code approach, copy and design choices.",Critic:"You review teammates' ideas, point out flaws, missing requirements and risks, and suggest fixes.",Polisher:"You focus on quality: polish, accessibility, consistency, wording and small details."};
const AG_TALK = [["Light",1,"One quick round of notes."],["Balanced",2,"Agents answer each other once."],["Deep",3,"A full debate before the final answer."]];
const AG = (()=>{ let o = {}; try{ o = JSON.parse(localStorage.getItem("klint_agent")||"{}") }catch{} return { on:!!o.on, n:Math.min(5,Math.max(1,o.n||3)), talk:Math.min(2,Math.max(0,o.talk??1)) }; })();
function syncAgent(){ const h = document.documentElement; h.dataset.agent = AG.on ? "1" : "0"; h.style.setProperty("--agn", '"'+AG.n+'"'); try{ localStorage.setItem("klint_agent", JSON.stringify(AG)); }catch{} }

function agCalls(){ return AG.n>1 ? AG.n*AG_TALK[AG.talk][1]+1 : 1; }

function buildAgentTalk(log){
  const d = document.createElement("div"); d.className = "agt" + (log ? "" : " open");
  d.innerHTML = `<button type="button" class="agt-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;color:var(--muted);transform:none"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.2 19c.4-3.3 2.8-5.2 5.8-5.2s5.4 1.9 5.8 5.2"/><path d="M16 5.6a3 3 0 0 1 0 5.8M18 14c1.7.7 2.7 2.4 3 5"/></svg><span>Agent discussion</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><div class="agt-b"></div>`;

async function runAgents(c, talk, status){
  const n = AG.n, roles = AG_ROLES[n], rounds = n>1 ? AG_TALK[AG.talk][1] : 0, total = n*rounds;
  Task.start("Agent team \u00b7 "+n+(n>1?" agents":" agent"), [...roles, "Compose the answer"]);
  const ask = (c.messages[c.messages.length-1].content||"").slice(0,4000); const log = []; let done = 0;
  for(let r=1; r<=rounds; r++){
    for(let i=0; i<n; i++){
      if(abortFlag) return {log, n, total, notes:"", final:n};
      const role = roles[i];
      Task.set(i, "active", rounds>1 ? "Round "+r+" of "+rounds : "Working"); status.textContent = role+" is thinking...";
      const hist = log.map(m=>m.a+": "+m.t).join("\n\n");
      const sys = "You are the "+role+" on a small AI team helping the user. "+AG_DESC[role]+" Your teammates: "+roles.filter(x=>x!==role).join(", ")+". Talk directly to them by name. At most 110 words, no preamble, no headings. Do NOT write the final answer.";
      const user = "User request:\n"+ask+"\n\nTeam discussion so far:\n"+(hist||"(nothing yet)")+"\n\n"+(r>1 ? "This is round "+r+" of "+rounds+". React to specific points teammates made: agree, push back or refine." : "Give your contribution.");
      let t = ""; try{ t = await quickChat(sys, user, 60000); }catch(_){}
      if(t){ log.push({a:role, t, r}); talk.add(role, t, r); }
      done++; Task.set(i, r===rounds ? "done" : "pending", ""); Task.p(done/(total+1)*0.95);
    }
  }
  Task.set(n, "active", "Writing");
  const hist = log.map(m=>m.a+": "+m.t).join("\n\n");
  const notes = log.length ? "\n\n# Team notes (a private discussion between your agents; use the best points, resolve disagreements, never mention the team or quote them)\n"+hist : "";
  return {log, n, total, notes, final:n};
}

  m.onclick = e=>{
    if(e.target===m || e.target.closest("[data-x]")) return m.classList.remove("open");
    const g = e.target.closest("[data-get]"), t = e.target.closest("[data-tg]"), o = e.target.closest("[data-open]"), tr = e.target.closest("[data-try]");
    if(g){ g.classList.add("load"); g.textContent = "Installing"; setTimeout(()=>{ plSet(g.dataset.get,{installed:true,active:true}); toast(PLUGINS.find(x=>x.id===g.dataset.get).name+" installed and active"); openPlugins(); }, 900); }
    else if(t){ const id = t.dataset.tg; plSet(id,{active:!PL.get()[id].active}); openPlugins(); }
    else if(o){ if(!plOn(o.dataset.open)) plSet(o.dataset.open,{active:true}); m.classList.remove("open"); openMotive(); }
    else if(tr){
      const pl = PLUGINS.find(x=>x.id===tr.dataset.try); if(!pl) return;
      if(!plOn(pl.id)) plSet(pl.id,{installed:true,active:true});
      m.classList.remove("open");

      if(h && h._ta){ h._ta.value = pl.starter||""; h._fit && h._fit(); h._ta.focus(); }
      toast(pl.name+" is active. Edit the prompt and send it.");
    }
  };
}

  const chips = (k,a)=>`<div class="mchips">${a.map(x=>`<button data-k="${k}" data-v="${Array.isArray(x)?x[1]:x}" class="${(Array.isArray(x)?x[1]:x)===MV[k]?"on":""}">${Array.isArray(x)?x[0]:x}</button>`).join("")}</div>`;
  const L0 = MV.theme || MV_LOOKS[MV.look] || MV_LOOKS["Apple dark"];
  const m = modal("motive", `<div class="mcard"><div class="mtlb"><button class="mtl r" data-x aria-label="Close"></button><i class="mtl y"></i><i class="mtl g"></i></div><div class="mh"><div><h2>Motive</h2><p>Describe a motion graphic. Refine it, recolour it, scrub it, download it.</p></div></div><div class="ms"><div>
  <label>Idea</label><textarea id="mvP" placeholder="e.g. Logo reveal for a coffee brand with warm gradients"></textarea>
  <label>Style</label>${chips("style",["Kinetic type","Logo reveal","Loader","Abstract loop","Infographic"])}
  <label>Format</label>${chips("ratio",[["16:9","16 / 9"],["1:1","1 / 1"],["9:16","9 / 16"]])}
  <label>Length (instant, no AI call)</label>${chips("dur",[["2s","2"],["4s","4"],["8s","8"]])}
  <label>Look (instant, no AI call)</label>${chips("look",Object.keys(MV_LOOKS))}
  <div class="mcol"><label>Accent<input type="color" id="mvAc" value="${L0.accent}"></label><label>Background<input type="color" id="mvBg" value="${L0.bg}"></label></div>
  <button class="pbtn" id="mvGo" style="width:100%;margin-top:14px">Generate</button>
  <label>Refine</label><input class="t" id="mvR" placeholder="Make the headline bigger, add a second scene..."><button class="pbtn ghost" id="mvRef" style="width:100%;margin-top:8px">Apply change</button></div>
  <div><div class="mstage"><div class="fr" id="mvFr" style="aspect-ratio:${MV.ratio}"><div class="ph" id="mvPh">Your motion graphic will appear here</div><iframe id="mvIf" sandbox="allow-scripts" hidden></iframe></div></div>
  <div class="mbar"><div class="mseg"><button id="mvPl" aria-label="Pause"></button><button id="mvRs" aria-label="Restart"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5"/></svg></button></div><input type="range" class="msl" id="mvSk" min="0" max="1000" value="0" aria-label="Timeline"><button class="mpill" id="mvSp">1x</button><button class="mpill pri" id="mvDl">Download</button><button class="mpill" id="mvCp">Copy</button></div>
  <div class="mnote" id="mvSt"></div><div class="mnote dim" id="mvUs"></div></div></div></div>`);
  const $m = s=>m.querySelector(s), fr = $m("#mvIf"); let paused = false, busyM = false; const IPL = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>`, IPA = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>`; const setSk = v=>{ const k=$m("#mvSk"); k.value=v; k.style.setProperty("--v", v/10); }; $m("#mvPl").innerHTML = IPA;
  const post = (c,v)=>fr.contentWindow && fr.contentWindow.postMessage({m:"mv",c,v},"*");
  const say = (t, cls) => { const e = $m("#mvSt"); e.textContent = t || ""; e.className = "mnote " + (cls || ""); };
  const show = code=>{ MV.code = code; $m("#mvPh").style.display = "none"; fr.hidden = false; say(""); fr.srcdoc = mvBundle(code, { qa:true, ctrl:true }); };
  const syncPickers = () => { const L = MV.theme || MV_LOOKS[MV.look] || MV_LOOKS["Apple dark"]; $m("#mvAc").value = L.accent; $m("#mvBg").value = L.bg; };
  const tok = (R, out, sysLen, userLen) => { const real = R && R.calls; const i = real ? R.in : Math.round((sysLen + userLen) / 4), o = real ? R.out : Math.round(out.length / 4); $m("#mvUs").textContent = (real ? "" : "≈ ") + fmtTok(i) + " in · " + fmtTok(o) + " out" + (R && R.usd ? " · " + fmtUsd(R.usd) : ""); };
  /* one streamed call at a modest effort, on the model you picked (not the side model) */
  const call = async (sys, user, eff, label) => {
    if(busy) throw new Error("The chat is still answering. Try again in a moment.");
    const pe = effort; effort = eff; abortFlag = false; let out = "", gb = $m("#mvGo"); Usage.begin();
    try{ await streamAI([{role:"user", content:user}], t => { out += t; gb.textContent = label + " · " + fmtTok(out.length/4); }, sys); }
    finally{ effort = pe; }
    const R = Usage.take(); tok(R, out, sys.length, user.length); return out;
  };
  const apply = async (code, out, eff) => {
    if(Patch.has(out)){
      let r = Patch.resolve(code, out);
      if(r.total && !r.failed.length) return r.html;
      if(r.total && r.failedBlocks.length){ const fx = await Repair.run(code, out, r); if(fx){ const r2 = Patch.resolve(code, fx); if(r2.total && !r2.failed.length) return r2.html; } }
      const full = await call(mvSys(false) + "\n\n# CURRENT FILE\n```html\n" + code + "\n```\nApply the change below to the current file and return the COMPLETE updated file.", MV.lastAsk || "", eff, "Rewriting");
      return mvExtract(full);
    }
    return mvExtract(out);
  };
  const busyUI = (on, label) => { const gb = $m("#mvGo"), rb = $m("#mvRef"); gb.classList.toggle("load", on); rb.disabled = on; gb.disabled = on; if(!on) gb.textContent = "Generate"; else if(label) gb.textContent = label; };
  const generate = async idea => {
    if(busyM) return; busyM = true; busyUI(true, "Writing"); MV.tries = 0;
    try{
      const out = await call(mvSys(false), mvBrief(idea), 2, "Writing"), code = mvExtract(out);
      if(!code) throw new Error("no code"); MV.theme = null; syncPickers(); show(code); say("Checking the timeline...", "dim");
    }catch(err){ toast(err && err.message && !/^no code/.test(err.message) ? err.message : "Could not generate, try again", 3500); }
    busyM = false; busyUI(false);
  };
  const refine = async (ask, silent) => {
    if(busyM) return; busyM = true; busyUI(true, "Updating"); MV.lastAsk = ask;
    try{
      const out = await call(mvSys(true, MV.code), ask, 1, "Updating"), code = await apply(MV.code, out, 1);
      if(!code) throw new Error("no code"); show(code); say(silent ? "Fixed automatically." : "Updated. Checking...", "dim");
    }catch(err){ toast(err && err.message && !/^no code/.test(err.message) ? err.message : "Could not apply that change", 3500); }
    busyM = false; busyUI(false);
  };
  m.onclick = e=>{
    if(e.target===m || e.target.closest("[data-x]")) return m.classList.remove("open");
    const k = e.target.closest("[data-k]");
    if(k){
      MV[k.dataset.k] = k.dataset.v; k.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===k));
      if(k.dataset.k==="ratio") $m("#mvFr").style.aspectRatio = MV.ratio;
      if(k.dataset.k==="look"){ MV.theme = Object.assign({}, MV_LOOKS[MV.look]); syncPickers(); }
      if((k.dataset.k==="look" || k.dataset.k==="dur") && MV.code) show(MV.code);
    }
  };
  const pick = () => { MV.theme = { bg:$m("#mvBg").value, accent:$m("#mvAc").value, fg:null, accent2:null }; if(MV.code) show(MV.code); };
  $m("#mvAc").onchange = pick; $m("#mvBg").onchange = pick;
  $m("#mvGo").onclick = ()=>{ const p = $m("#mvP").value.trim(); if(!p) return toast("Describe your motion graphic first"); generate(p); };
  $m("#mvRef").onclick = ()=>{ const r = $m("#mvR").value.trim(); if(!MV.code) return toast("Generate something first"); if(!r) return; MV.tries = 0; refine(r); $m("#mvR").value = ""; };
  $m("#mvPl").onclick = ()=>post(paused?"play":"pause");
  $m("#mvRs").onclick = ()=>post("restart");
  const rates = [1,.5,2]; let ri = 0; $m("#mvSp").onclick = ()=>{ ri = (ri+1)%3; $m("#mvSp").textContent = rates[ri]+"x"; post("rate", rates[ri]); };
  $m("#mvSk").oninput = e=>{ setSk(+e.target.value); post("seek", e.target.value/1000); };
  $m("#mvCp").onclick = ()=>{ if(MV.code){ navigator.clipboard && navigator.clipboard.writeText(mvBundle(MV.code)); toast("Code copied"); } };
  $m("#mvDl").onclick = ()=>{ if(!MV.code) return toast("Nothing to download yet"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([mvBundle(MV.code)],{type:"text/html"})); a.download = "motive-animation.html"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
  const onMsg = e=>{
    const d = e.data; if(!d || !m.classList.contains("open") || e.source !== fr.contentWindow) return;
    if(d.m==="mv"){ paused = d.paused; $m("#mvPl").innerHTML = paused?IPL:IPA; $m("#mvPl").setAttribute("aria-label", paused?"Play":"Pause"); if(!paused && document.activeElement!==$m("#mvSk")) setSk(Math.round(d.p*1000)); }
    else if(d.m==="mvdiag"){
      const bad = (d.e||[]).concat(d.w||[]);
      if(!bad.length){ say("Timeline checked: clean (" + (d.dur||0).toFixed(1) + "s loop)", "ok"); return; }
      if(MV.tries < 1 && !busyM){ MV.tries++; say("Found " + bad.length + " issue" + (bad.length>1?"s":"") + ", fixing automatically...", "warn"); refine("The preview audit found these problems:\n- " + bad.join("\n- ") + "\n\nFix only these with the smallest possible patch. Change nothing else.", true); }
      else say(bad[0], "warn");
    }
  };
  if(window.__mvMsg) window.removeEventListener("message", window.__mvMsg);
  window.__mvMsg = onMsg; window.addEventListener("message", onMsg);
  if(MV.code) show(MV.code);
}
$("#navPlugins").onclick = ()=>{ openPlugins(); if(innerWidth<760) $("#sb").classList.add("hide"); };
$("#navMotive").onclick = ()=>{ openMotive(); if(innerWidth<760) $("#sb").classList.add("hide"); };
syncPlugins();

/* ============ OPENING ANIMATION ============ */
(function(){
  const el = document.getElementById("kxIntro"); if(!el) return;
  const root = document.documentElement, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll(".nav,.newchat,.hsearch").forEach((n, i) => n.style.setProperty("--ni", i));
  let done = false;
  const open = () => {
    if(done) return; done = true;
    document.querySelectorAll(".chip").forEach((c, i) => c.style.setProperty("--ci", i));
    root.classList.add("kx-boot"); el.classList.add("go");
    setTimeout(() => { el.classList.add("gone"); setTimeout(() => root.classList.remove("kx-boot"), 2400); }, 950);
  };
  el.addEventListener("click", open); addEventListener("keydown", open, {once: true});
  setTimeout(open, reduce ? 400 : 3000);
})();

</script>
</body>
